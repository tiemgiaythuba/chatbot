<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tiệm giấy Thứ Ba — Tư vấn & Đặt giấy thủ công</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F4EFE6;
      --bg-app: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-soft: #F1EBE1;
      --border: #E5DDD0;
      --primary: #5C4033;
      --primary-hover: #473026;
      --accent: #4B6B50;
      --accent-soft: #E8F0E9;
      --warn-bg: #FDF3E7;
      --warn-text: #9C5A1E;
      --text-main: #2D241E;
      --text-muted: #786B61;
      --shadow-sm: 0 2px 8px rgba(45, 36, 30, 0.05);
      --shadow-md: 0 8px 24px rgba(45, 36, 30, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 15px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }

    .brand-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      background: #FFFFFF;
    }

    .brand-info { min-width: 0; }
    .brand-info h1 {
      font-family: 'Lora', serif;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; display: inline-block; flex-shrink: 0; }
    .status-dot.loading { background: #E6A23C; animation: pulse 1.2s infinite; }
    .status-dot.error { background: #D9534F; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 9px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .new-chat-btn:active { background: var(--border); color: var(--primary); }

    .cart-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 7px 11px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .cart-badge {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      min-width: 19px;
      height: 19px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* Chat Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; }
    .msg-row.full-width { max-width: 100%; width: 100%; }

    .bubble {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.52;
      white-space: pre-line;
      word-break: break-word;
    }

    .msg-row.bot .bubble {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg-row.user .bubble {
      background: var(--primary);
      color: #FAF7F2;
      border-bottom-right-radius: 4px;
    }

    .quick-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    /* Catalog Carousel */
    .catalog-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .product-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }

    .product-card {
      min-width: 226px;
      max-width: 226px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      flex-shrink: 0;
    }

    .product-thumb {
      width: 100%;
      height: 132px;
      background: var(--bg-soft);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-thumb img.slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.55s ease-in-out;
      z-index: 1;
    }
    .product-thumb img.slide-img.active {
      opacity: 1;
    }

    .slide-dots {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 3;
      background: rgba(30, 22, 17, 0.35);
      padding: 3px 6px;
      border-radius: 999px;
    }
    .slide-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
    }
    .slide-dot.active {
      background: #FFFFFF;
      transform: scale(1.2);
    }

    .paper-art {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      font-family: 'Lora', serif;
      font-size: 12.5px;
      color: var(--primary);
      background-image: radial-gradient(rgba(92, 64, 51, 0.12) 1px, transparent 0);
      background-size: 12px 12px;
    }

    .stock-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      z-index: 3;
      max-width: calc(100% - 16px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stock-pill.out { background: var(--warn-bg); color: var(--warn-text); }

    .product-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .product-title { font-size: 13.5px; font-weight: 600; color: var(--text-main); line-height: 1.3; }
    .price-block { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .price-main { font-size: 13.5px; font-weight: 700; color: var(--primary); }
    .price-sub { font-size: 11.5px; font-weight: 600; color: #4A3D34; }
    .unsized-hint { font-size: 11px; color: var(--warn-text); margin-top: 2px; }

    .card-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
    .buy-btn-row { display: flex; gap: 5px; }

    .btn-outline {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary-sm {
      flex: 1;
      background: var(--primary);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-accent-sm {
      flex: 1;
      background: var(--accent-soft);
      border: 1px solid #C8DBC9;
      color: #2E5A36;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-preorder-sm {
      width: 100%;
      background: var(--warn-bg);
      border: 1px solid #EBD3B5;
      color: var(--warn-text);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Detail Modal 2-Column Gallery */
    .detail-gallery-split {
      display: flex;
      gap: 2%;
      align-items: stretch;
    }
    .detail-gallery-main {
      position: relative;
      width: 80%;
      aspect-ratio: 1 / 1;
      max-height: 235px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    .detail-gallery-main.single {
      width: 100%;
      max-height: 245px;
    }
    .detail-gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.88);
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .gallery-thumbs-col {
      width: 18%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      justify-content: flex-start;
    }
    .gallery-thumb-btn {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      padding: 0;
      cursor: pointer;
      background: var(--bg-soft);
    }
    .gallery-thumb-btn.active {
      border-color: var(--primary);
    }
    .gallery-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spec-bullets {
      list-style: disc;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13.5px;
      color: var(--text-main);
    }

    /* Suggested Items Card inside AI Reply */
    .suggest-box {
      margin-top: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .suggest-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }

    .suggest-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Contact Social Card */
    .contact-card {
      margin-top: 8px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .prefill-box {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .copy-mini {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }

    .social-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      color: #fff;
    }
    .social-fb { background: #1877F2; }
    .social-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .social-th { background: #1C1C1E; }

    /* Bottom Composer */
    .composer-wrap {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    .hint-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .hint-strip::-webkit-scrollbar { display: none; }

    .hint-pill {
      background: var(--bg-app);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 4px 6px 4px 14px;
    }
    .input-row:focus-within { border-color: var(--primary); }
    .input-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      padding: 7px 0;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 22, 17, 0.48);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .overlay.open { display: flex; }

    .sheet-modal {
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      background: var(--bg-app);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.24s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-head {
      padding: 14px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h2 { font-family: 'Lora', serif; font-size: 17px; font-weight: 600; }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-app);
      font-size: 16px;
      cursor: pointer;
    }

    .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .cart-item-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 6px;
    }
    .qty-btn { width: 24px; height: 24px; border: none; background: #fff; border-radius: 6px; font-weight: 700; cursor: pointer; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12.5px; font-weight: 600; color: var(--text-main); }
    .form-group small { font-size: 11px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
    }

    .platform-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .plat-option {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .plat-option.selected { border-color: var(--primary); background: var(--bg-soft); color: var(--primary); }

    .saved-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border: 1px solid #C8DBC9;
      color: #2E5A36;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
    .clear-saved-btn {
      background: #fff;
      border: 1px solid #C8DBC9;
      color: #9C5A1E;
      border-radius: 6px;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .summary-line { display: flex; justify-content: space-between; gap: 10px; }
    .summary-total {
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      margin-top: 2px;
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
    }

    .submit-order-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-order-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: #2D241E;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }

    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="brand-avatar">
          <img src="logo.png" alt="Logo Tiệm giấy Thứ Ba" onerror="this.remove();" />
          <span>TB</span>
        </div>
        <div class="brand-info">
          <h1>Tiệm giấy Thứ Ba</h1>
          <div class="status-line">
            <span id="statusDot" class="status-dot loading"></span>
            <span id="statusText">Đang cập nhật kho giấy...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="new-chat-btn" onclick="resetChatSession()" title="Bắt đầu cuộc trò chuyện mới">↻ Chat mới</button>
        <button type="button" class="cart-btn" onclick="openCartModal()">
          <span>Giỏ hàng</span>
          <span id="cartCount" class="cart-badge">0</span>
        </button>
      </div>
    </header>

    <main id="chatStream" class="chat-stream"></main>

    <div class="composer-wrap">
      <div class="hint-strip">
        <button class="hint-pill" onclick="sendQuickText('Xem các loại giấy đang có sẵn')">Giấy đang có sẵn</button>
        <button class="hint-pill" onclick="sendQuickText('Giấy có viết được bút mực không?')">Viết bút mực</button>
        <button class="hint-pill" onclick="sendQuickText('Phí ship như thế nào ạ?')">Phí ship</button>
        <button class="hint-pill" onclick="openCartModal()">Lên đơn ngay</button>
      </div>
      <form class="input-row" onsubmit="handleFormSubmit(event)">
        <input id="chatInput" type="text" placeholder="Hỏi tiệm loại giấy, số lượng, giá tiền..." autocomplete="off" />
        <button id="sendBtn" type="submit" class="send-btn" aria-label="Gửi">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="detailOverlay" class="overlay" onclick="closeOverlay(event, 'detailOverlay')">
    <div class="sheet-modal">
      <div class="modal-head">
        <h2 id="detailTitle">Chi tiết sản phẩm</h2>
        <button class="close-btn" onclick="hideModal('detailOverlay')">✕</button>
      </div>
      <div id="detailBody" class="modal-body"></div>
    </div>
  </div>

  <div id="cartOverlay" class="overlay" onclick="closeOverlay(event, 'cartOverlay')">
    <div class="sheet-modal">
      <div class="modal-head">
        <h2>Giỏ giấy & Thông tin gửi hàng</h2>
        <button class="close-btn" onclick="hideModal('cartOverlay')">✕</button>
      </div>
      <div id="cartBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbBP4TCXCwWPNOlCVhe2ke8FcG2DrH_FmVunFesAptU4eEVPuNJizwQnbBlAGycXMf/exec";

    const SOCIAL_LINKS = {
      facebook: "https://www.facebook.com/search/top?q=Ti%E1%BB%87m%20gi%E1%BA%A5y%20Th%E1%BB%A9%20Ba",
      instagram: "https://www.instagram.com/",
      threads: "https://www.threads.net/"
    };

    const CART_STORAGE_KEY = "TGTB_CART_V1";
    const CUSTOMER_STORAGE_KEY = "TGTB_CUSTOMER_INFO_V1";
    const IS_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";

    let products = [];
    let cart = [];
    let chatHistory = [];
    let selectedCategory = "Tất cả";
    let selectedPlatform = "Instagram";
    let isSending = false;
    let detailSlideIndex = 0;
    let detailImages = [];
    let detailTimer = null;

    const chatStream = document.getElementById("chatStream");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttrJs(str) {
      return String(str ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\r?\n/g, " ");
    }

    function saveCartToStorage() {
      try {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      } catch (e) {}
    }

    function loadCartFromStorage() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            cart = parsed.filter(it => it && it.id && Number(it.qty) > 0);
          }
        }
      } catch (e) {}
      updateCartBadge();
    }

    function reconcileCartWithInventory() {
      if (!cart.length) return;
      let adjusted = false;
      const nextCart = [];
      const usedMap = {};

      cart.forEach(item => {
        const p = products.find(prod => prod.id === item.id);
        if (!p || p.stock <= 0) {
          adjusted = true;
          return;
        }
        let mode = item.buyMode === "pack" ? "pack" : "unit";
        if (mode === "pack" && !hasPackOption(p)) mode = "unit";
        if (mode === "unit" && !hasUnitOption(p) && hasPackOption(p)) mode = "pack";

        const baseUnitsPerQty = mode === "pack" ? p.packSize : 1;
        const price = mode === "pack" ? p.packPrice : p.unitPrice;
        const unitLabel = mode === "pack" ? `${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})` : p.baseUnit;

        if (price <= 0) {
          adjusted = true;
          return;
        }

        const alreadyUsed = usedMap[p.id] || 0;
        const remainingStock = Math.max(0, p.stock - alreadyUsed);
        const maxPossibleQty = Math.floor(remainingStock / baseUnitsPerQty);

        if (maxPossibleQty <= 0) {
          adjusted = true;
          return;
        }

        const finalQty = Math.min(Number(item.qty || 1), maxPossibleQty);
        if (finalQty !== Number(item.qty)) adjusted = true;

        usedMap[p.id] = alreadyUsed + finalQty * baseUnitsPerQty;
        nextCart.push({
          key: `${p.id}_${mode}`,
          id: p.id,
          name: p.name,
          buyMode: mode,
          unitLabel,
          baseUnitsPerQty,
          price,
          qty: finalQty
        });
      });

      cart = nextCart;
      saveCartToStorage();
      updateCartBadge();
      if (adjusted) {
        showToast("Đã cập nhật lại giỏ hàng theo tồn kho mới nhất");
      }
    }

    function loadSavedCustomerInfo() {
      try {
        const raw = localStorage.getItem(CUSTOMER_STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && typeof data === "object") return data;
      } catch (e) {}
      return null;
    }

    function saveCustomerInfoToStorage(info) {
      try {
        localStorage.setItem(CUSTOMER_STORAGE_KEY, JSON.stringify({
          customerName: info.customerName || "",
          phone: info.phone || "",
          address: info.address || "",
          platform: info.platform || "Instagram",
          socialHandle: info.socialHandle || ""
        }));
      } catch (e) {}
    }

    function clearSavedCustomerInfo() {
      try {
        localStorage.removeItem(CUSTOMER_STORAGE_KEY);
      } catch (e) {}
      selectedPlatform = "Instagram";
      renderCartModalContent(true);
      showToast("Đã xóa thông tin giao hàng đã lưu");
    }

    function parseImages(p) {
      if (Array.isArray(p.imageUrls) && p.imageUrls.length) {
        return p.imageUrls.map(u => String(u).trim()).filter(Boolean).slice(0, 3);
      }
      if (!p.imageUrl) return [];
      return String(p.imageUrl).split(/[\n,]+/).map(u => u.trim()).filter(Boolean).slice(0, 3);
    }

    function formatVND(num) {
      return Number(num || 0).toLocaleString("vi-VN") + "đ";
    }

    function formatShortK(num) {
      const n = Number(num || 0);
      if (n >= 1000 && n % 1000 === 0) return (n / 1000) + "K";
      return formatVND(n);
    }

    function showToast(text) {
      const t = document.getElementById("toast");
      t.textContent = text;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Đã copy nội dung để bạn dán tin nhắn"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Đã copy nội dung để bạn dán tin nhắn");
      }
    }

    function scrollBottom() {
      requestAnimationFrame(() => {
        chatStream.scrollTop = chatStream.scrollHeight;
      });
    }

    function hasPackOption(p) {
      return Number(p.packPrice || 0) > 0 && Number(p.packSize || 1) > 1;
    }

    function hasUnitOption(p) {
      return Number(p.unitPrice || 0) > 0;
    }

    // Nhãn tồn kho gọn trên góc ảnh thumbnail (tránh tràn mép thẻ)
    function getCompactStockBadge(p) {
      if (p.stock > 0) {
        return `Còn ${p.stock} ${p.baseUnit}`;
      }
      if (Number(p.unsizedStock || 0) > 0) {
        return `Chưa gia keo (${p.unsizedStock})`;
      }
      return "Tạm hết sẵn";
    }

    function getFullStockDetail(p) {
      if (p.stock > 0) {
        if (hasPackOption(p)) {
          const packs = Math.floor(p.stock / p.packSize);
          return `Còn ${p.stock} ${p.baseUnit} (${packs} ${p.packUnit || "gói"})`;
        }
        return `Còn ${p.stock} ${p.baseUnit}`;
      }
      return `0 ${p.baseUnit}`;
    }

    function formatSpecsBullets(specsText) {
      const raw = String(specsText || "").trim() || "Giấy tái chế thủ công từ tiệm giấy Thứ Ba.";
      // Bảo toàn số thập phân (VD: 14.8 x 21cm) trước khi tách theo dấu chấm câu hoặc xuống dòng
      const safe = raw.replace(/(\d)\.(\d)/g, "$1__DECIMAL__$2");
      const parts = safe
        .split(/[\r\n.]+/)
        .map(s => s.replace(/__DECIMAL__/g, ".").trim())
        .filter(Boolean);

      if (parts.length <= 1) {
        return `<p style="font-size:13.5px; color:var(--text-main);">${escapeHtml(raw)}</p>`;
      }
      return `<ul class="spec-bullets">${parts.map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>`;
    }

    function handleThumbImgError(imgEl) {
      const wrap = imgEl.parentElement;
      imgEl.remove();
      if (!wrap) return;
      const remaining = wrap.querySelectorAll("img.slide-img");
      if (remaining.length === 0) {
        const dots = wrap.querySelector(".slide-dots");
        if (dots) dots.remove();
        const fallback = wrap.querySelector(".paper-art");
        if (fallback) fallback.style.display = "flex";
      } else if (!Array.from(remaining).some(i => i.classList.contains("active"))) {
        remaining[0].classList.add("active");
      }
    }

    // Tự động chuyển ảnh cho các thẻ sản phẩm có từ 2 ảnh trở lên
    setInterval(() => {
      document.querySelectorAll(".product-thumb[data-multi='1']").forEach(thumb => {
        const imgs = thumb.querySelectorAll("img.slide-img");
        const dots = thumb.querySelectorAll(".slide-dot");
        if (imgs.length <= 1) return;
        let activeIdx = Array.from(imgs).findIndex(img => img.classList.contains("active"));
        const nextIdx = (activeIdx + 1) % imgs.length;
        imgs.forEach((img, idx) => img.classList.toggle("active", idx === nextIdx));
        dots.forEach((dot, idx) => dot.classList.toggle("active", idx === nextIdx));
      });
    }, 3000);

    async function loadInventory() {
      const dot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      dot.className = "status-dot loading";
      statusText.textContent = "Đang cập nhật kho giấy...";

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Không tải được kho");

        products = (json.products || []).map(p => ({
          ...p,
          stock: Number(p.stock || 0),
          unsizedStock: Number(p.unsizedStock || 0),
          packSize: Math.max(1, Number(p.packSize || 1)),
          packPrice: Number(p.packPrice || 0),
          unitPrice: Number(p.unitPrice || 0),
          imageUrls: parseImages(p)
        }));

        reconcileCartWithInventory();

        dot.className = "status-dot";
        const availableCount = products.filter(p => p.stock > 0).length;
        statusText.textContent = `Sẵn sàng • ${availableCount} mẫu đang có sẵn`;
      } catch (err) {
        dot.className = "status-dot error";
        statusText.textContent = "Lỗi kết nối kho — chạm để thử lại";
        statusText.style.cursor = "pointer";
        statusText.onclick = loadInventory;
        console.error(err);
      }
    }

    function resetChatSession() {
      if (isSending) return;
      chatHistory = [];
      chatStream.innerHTML = "";
      renderWelcome();
      showToast("Đã làm mới cuộc trò chuyện");
    }

    function renderWelcome() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="bubble">Tiệm giấy Thứ Ba chào bạn.
Mình có thể xem nhanh các mẫu giấy đang có sẵn, hỏi số lượng/giá tiền hoặc lên đơn trực tiếp ở đây mà không cần chờ tiệm rep nhé.</div>
        <div class="quick-grid">
          <button class="chip-btn" onclick="renderCatalogMessage()">Xem các loại giấy đang có</button>
          <button class="chip-btn" onclick="sendQuickText('Tư vấn giúp mình chọn giấy phù hợp nhé')">Tư vấn chọn giấy</button>
          <button class="chip-btn" onclick="openCartModal()">Lên đơn nhanh</button>
        </div>
      `;
      chatStream.appendChild(row);
    }

    function renderCatalogMessage(filterCat = "Tất cả") {
      selectedCategory = filterCat;
      const existing = document.getElementById("catalogCardRow");
      if (existing) existing.remove();

      const row = document.createElement("div");
      row.id = "catalogCardRow";
      row.className = "msg-row bot full-width";

      if (!products.length) {
        row.innerHTML = `<div class="bubble">Dạ kho giấy đang tải hoặc chưa có dữ liệu, bạn đợi vài giây rồi bấm lại giúp tiệm nhé.</div>`;
        chatStream.appendChild(row);
        scrollBottom();
        return;
      }

      const categories = ["Tất cả", ...new Set(products.map(p => p.category).filter(Boolean))];
      const filtered = filterCat === "Tất cả" ? products : products.filter(p => p.category === filterCat);

      const tabsHtml = categories.map(c =>
        `<button class="cat-tab ${c === filterCat ? 'active' : ''}" onclick="renderCatalogMessage('${escapeAttrJs(c)}')">${escapeHtml(c)}</button>`
      ).join("");

      const cardsHtml = filtered.map(p => {
        const isOut = p.stock <= 0;
        const hasUnsized = Number(p.unsizedStock || 0) > 0;
        const canPack = hasPackOption(p) && p.stock >= p.packSize;
        const canUnit = hasUnitOption(p) && p.stock >= 1;
        const imgs = parseImages(p);

        let priceHtml = "";
        if (hasPackOption(p) && hasUnitOption(p)) {
          priceHtml = `
            <div class="price-main">${formatShortK(p.packPrice)} / ${escapeHtml(p.packUnit || "gói")} (${p.packSize} ${escapeHtml(p.baseUnit)})</div>
            <div class="price-sub">Mua lẻ: ${formatShortK(p.unitPrice)} / ${escapeHtml(p.baseUnit)}</div>
          `;
        } else if (hasPackOption(p)) {
          priceHtml = `
            <div class="price-main">${formatShortK(p.packPrice)} / ${escapeHtml(p.packUnit || "gói")}</div>
            <div class="price-sub">Quy cách: ${p.packSize} ${escapeHtml(p.baseUnit)}/${escapeHtml(p.packUnit || "gói")}</div>
          `;
        } else {
          priceHtml = `
            <div class="price-main">${formatShortK(p.unitPrice)} / ${escapeHtml(p.baseUnit)}</div>
          `;
        }

        const unsizedNoteHtml = hasUnsized
          ? `<div class="unsized-hint">${isOut ? `Đang gia keo ${p.unsizedStock} ${escapeHtml(p.baseUnit)} (giao sau ~1 tuần)` : `Đang làm thêm ${p.unsizedStock} ${escapeHtml(p.baseUnit)} (~1 tuần)`}</div>`
          : "";

        let thumbHtml = "";
        if (imgs.length > 0) {
          const imgTags = imgs.map((url, idx) =>
            `<img class="slide-img ${idx === 0 ? 'active' : ''}" src="${escapeHtml(url)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="handleThumbImgError(this);" />`
          ).join("");
          const dotsHtml = imgs.length > 1
            ? `<div class="slide-dots">${imgs.map((_, idx) => `<span class="slide-dot ${idx === 0 ? 'active' : ''}"></span>`).join("")}</div>`
            : "";
          thumbHtml = `${imgTags}${dotsHtml}<div class="paper-art" style="display:none;"><span>${escapeHtml(p.name)}</span></div>`;
        } else {
          thumbHtml = `<div class="paper-art"><span>${escapeHtml(p.name)}</span></div>`;
        }

        const safeIdAttr = escapeAttrJs(p.id);
        let actionButtonsHtml = "";
        if (isOut && hasUnsized) {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Đặt trước (giao sau ~1 tuần)</button>`;
        } else if (isOut) {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Đặt làm thêm</button>`;
        } else if (canPack && canUnit) {
          actionButtonsHtml = `
            <div class="buy-btn-row">
              <button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'pack', 1)">+ ${escapeHtml(p.packUnit || "Gói")} (${formatShortK(p.packPrice)})</button>
              <button class="btn-accent-sm" onclick="addToCart('${safeIdAttr}', 'unit', 1)">+ Lẻ (${formatShortK(p.unitPrice)})</button>
            </div>
          `;
        } else if (canPack) {
          actionButtonsHtml = `<button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'pack', 1)">+ Thêm ${escapeHtml(p.packUnit || "gói")} (${formatShortK(p.packPrice)})</button>`;
        } else if (canUnit) {
          actionButtonsHtml = `<button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'unit', 1)">+ Thêm giỏ (${formatShortK(p.unitPrice)})</button>`;
        } else {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Không đủ gói — Đặt thêm</button>`;
        }

        return `
          <div class="product-card">
            <div class="product-thumb" data-multi="${imgs.length > 1 ? '1' : '0'}">
              ${thumbHtml}
              <span class="stock-pill ${isOut ? 'out' : ''}">${getCompactStockBadge(p)}</span>
            </div>
            <div class="product-body">
              <div>
                <div class="product-title">${escapeHtml(p.name)}</div>
                <div class="price-block">${priceHtml}${unsizedNoteHtml}</div>
              </div>
              <div class="card-actions">
                ${actionButtonsHtml}
                <button class="btn-outline" onclick="openDetailModal('${safeIdAttr}')">Xem chi tiết</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      row.innerHTML = `
        <div class="catalog-box">
          <div class="cat-tabs">${tabsHtml}</div>
          <div class="product-carousel">${cardsHtml}</div>
        </div>
      `;
      chatStream.appendChild(row);
      scrollBottom();
    }

    function askPreorder(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      if (p.stock <= 0 && Number(p.unsizedStock || 0) > 0) {
        sendQuickText(`Mẫu "${p.name}" đang có ${p.unsizedStock} ${p.baseUnit} chưa gia keo (giao sau ~1 tuần), mình muốn đặt trước mẫu này ạ`);
      } else {
        sendQuickText(`Mẫu "${p.name}" đang tạm hết, mình muốn hỏi đặt làm thêm ạ`);
      }
    }

    function setDetailSlide(idx) {
      if (!detailImages.length) return;
      detailSlideIndex = (idx + detailImages.length) % detailImages.length;
      const mainImg = document.getElementById("detailMainImg");
      if (mainImg) mainImg.src = detailImages[detailSlideIndex];
      document.querySelectorAll(".gallery-thumb-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === detailSlideIndex);
      });
    }

    function openDetailModal(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      if (detailTimer) clearInterval(detailTimer);

      const isOut = p.stock <= 0;
      const hasUnsized = Number(p.unsizedStock || 0) > 0;
      const canPack = hasPackOption(p) && p.stock >= p.packSize;
      const canUnit = hasUnitOption(p) && p.stock >= 1;
      detailImages = parseImages(p);
      detailSlideIndex = 0;

      let galleryHtml = "";
      if (detailImages.length > 0) {
        const hasMulti = detailImages.length > 1;
        const navArrows = hasMulti ? `
          <button type="button" class="gallery-nav-btn" style="left:8px;" onclick="setDetailSlide(detailSlideIndex - 1)">‹</button>
          <button type="button" class="gallery-nav-btn" style="right:8px;" onclick="setDetailSlide(detailSlideIndex + 1)">›</button>
        ` : "";
        const thumbsCol = hasMulti ? `
          <div class="gallery-thumbs-col">
            ${detailImages.map((url, idx) => `
              <button type="button" class="gallery-thumb-btn ${idx === 0 ? 'active' : ''}" onclick="setDetailSlide(${idx})">
                <img src="${escapeHtml(url)}" alt="Ảnh ${idx + 1}" />
              </button>
            `).join("")}
          </div>
        ` : "";
        galleryHtml = `
          <div class="detail-gallery-split">
            <div class="detail-gallery-main ${hasMulti ? '' : 'single'}">
              <img id="detailMainImg" src="${escapeHtml(detailImages[0])}" alt="${escapeHtml(p.name)}" />
              ${navArrows}
            </div>
            ${thumbsCol}
          </div>
        `;
      }

      let priceRows = "";
      if (hasPackOption(p)) {
        priceRows += `<div class="summary-line"><span>Giá theo ${escapeHtml(p.packUnit || "gói")} (${p.packSize} ${escapeHtml(p.baseUnit)}):</span><strong>${formatVND(p.packPrice)}</strong></div>`;
      }
      if (hasUnitOption(p)) {
        priceRows += `<div class="summary-line"><span>Giá lẻ từng ${escapeHtml(p.baseUnit)}:</span><strong>${formatVND(p.unitPrice)}</strong></div>`;
      }

      const unsizedLine = hasUnsized
        ? `<div class="summary-line"><span>Giấy chưa gia keo (giao sau ~1 tuần):</span><strong style="color:var(--warn-text);">${p.unsizedStock} ${escapeHtml(p.baseUnit)}</strong></div>`
        : "";

      const safeIdAttr = escapeAttrJs(p.id);
      let modalButtons = "";
      if (isOut) {
        const btnLabel = hasUnsized
          ? "Đặt trước mẻ chưa gia keo (giao sau ~1 tuần)"
          : "Nhắn tiệm đặt làm thêm mẫu này";
        modalButtons = `<button class="submit-order-btn" onclick="hideModal('detailOverlay'); askPreorder('${safeIdAttr}')">${btnLabel}</button>`;
      } else {
        modalButtons = `<div style="display:flex; gap:8px;">`;
        if (canPack) {
          modalButtons += `<button class="submit-order-btn" style="flex:1;" onclick="addToCart('${safeIdAttr}', 'pack', 1); hideModal('detailOverlay');">+ Thêm 1 ${escapeHtml(p.packUnit || "gói")} (${formatShortK(p.packPrice)})</button>`;
        }
        if (canUnit) {
          modalButtons += `<button class="submit-order-btn" style="flex:1; background:var(--accent);" onclick="addToCart('${safeIdAttr}', 'unit', 1); hideModal('detailOverlay');">+ Thêm 1 ${escapeHtml(p.baseUnit)} (${formatShortK(p.unitPrice)})</button>`;
        }
        modalButtons += `</div>`;
      }

      document.getElementById("detailTitle").textContent = p.name;
      document.getElementById("detailBody").innerHTML = `
        ${galleryHtml}
        <div class="summary-card">
          ${priceRows}
          <div class="summary-line"><span>Sẵn sàng giao ngay:</span><strong>${getFullStockDetail(p)}</strong></div>
          ${unsizedLine}
          <div class="summary-line"><span>Nhóm:</span><span>${escapeHtml(p.category)}</span></div>
        </div>
        <div class="summary-card">
          <strong style="font-size:13px;">Đặc điểm chi tiết:</strong>
          ${formatSpecsBullets(p.specs)}
        </div>
        ${modalButtons}
      `;
      document.getElementById("detailOverlay").classList.add("open");

      if (detailImages.length > 1) {
        detailTimer = setInterval(() => setDetailSlide(detailSlideIndex + 1), 3000);
      }
    }

    function hideModal(id) {
      if (id === "detailOverlay" && detailTimer) {
        clearInterval(detailTimer);
        detailTimer = null;
      }
      document.getElementById(id).classList.remove("open");
    }
    function closeOverlay(e, id) { if (e.target.id === id) hideModal(id); }

    function updateCartBadge() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").textContent = totalQty;
    }

    function getUsedBaseUnitsForProduct(productId) {
      return cart
        .filter(c => c.id === productId)
        .reduce((sum, c) => sum + c.qty * c.baseUnitsPerQty, 0);
    }

    function addToCart(id, buyMode = "pack", qty = 1) {
      const p = products.find(item => item.id === id);
      if (!p || p.stock <= 0) {
        showToast("Mẫu này hiện tạm hết hàng có sẵn ạ");
        return;
      }

      let mode = buyMode;
      if (mode === "pack" && !hasPackOption(p)) mode = "unit";
      if (mode === "unit" && !hasUnitOption(p) && hasPackOption(p)) mode = "pack";

      const baseUnitsPerQty = mode === "pack" ? p.packSize : 1;
      const price = mode === "pack" ? p.packPrice : p.unitPrice;
      const unitLabel = mode === "pack" ? `${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})` : p.baseUnit;

      if (price <= 0) {
        showToast("Sản phẩm chưa có giá cho tùy chọn này ạ");
        return;
      }

      const alreadyUsed = getUsedBaseUnitsForProduct(id);
      const needed = qty * baseUnitsPerQty;
      if (alreadyUsed + needed > p.stock) {
        showToast(`Kho sẵn sàng chỉ còn ${p.stock} ${p.baseUnit} ạ`);
        return;
      }

      const key = `${id}_${mode}`;
      const existing = cart.find(c => c.key === key);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          key,
          id: p.id,
          name: p.name,
          buyMode: mode,
          unitLabel,
          baseUnitsPerQty,
          price,
          qty
        });
      }

      saveCartToStorage();
      updateCartBadge();
      showToast(`Đã thêm ${qty} ${unitLabel} ${p.name}`);
    }

    function changeCartQty(key, delta) {
      const idx = cart.findIndex(c => c.key === key);
      if (idx === -1) return;
      const item = cart[idx];
      const p = products.find(prod => prod.id === item.id);
      const nextQty = item.qty + delta;

      if (nextQty <= 0) {
        cart.splice(idx, 1);
      } else {
        if (p) {
          const otherUsed = cart
            .filter(c => c.id === item.id && c.key !== key)
            .reduce((s, c) => s + c.qty * c.baseUnitsPerQty, 0);
          if (otherUsed + nextQty * item.baseUnitsPerQty > p.stock) {
            showToast(`Kho sẵn sàng chỉ còn tối đa ${p.stock} ${p.baseUnit} ạ`);
            return;
          }
        }
        item.qty = nextQty;
      }
      saveCartToStorage();
      updateCartBadge();
      renderCartModalContent();
    }

    function calcCartTotals() {
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const hasKit = cart.some(i => i.name.toLowerCase().includes("kit"));
      const totalPacks = cart.filter(i => i.buyMode === "pack").reduce((sum, i) => sum + i.qty, 0);
      const totalBaseUnits = cart.reduce((sum, i) => sum + i.qty * i.baseUnitsPerQty, 0);
      const shipFee = (subtotal === 0 || subtotal >= 200000 || hasKit) ? 0 : 15000;
      return { subtotal, shipFee, total: subtotal + shipFee, totalPacks, totalBaseUnits };
    }

    function openCartModal() {
      renderCartModalContent();
      document.getElementById("cartOverlay").classList.add("open");
    }

    function renderCartModalContent(forceBlankCustomer = false) {
      const body = document.getElementById("cartBody");
      if (!cart.length) {
        body.innerHTML = `
          <div style="text-align:center; padding:24px 10px;">
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:14px;">Giỏ giấy của mình đang trống ạ.</p>
            <button class="submit-order-btn" onclick="hideModal('cartOverlay'); renderCatalogMessage();">Xem các loại giấy đang có</button>
          </div>
        `;
        return;
      }

      const savedCust = forceBlankCustomer ? null : loadSavedCustomerInfo();
      if (savedCust && savedCust.platform) {
        selectedPlatform = savedCust.platform;
      }

      const { subtotal, shipFee, total, totalPacks, totalBaseUnits } = calcCartTotals();
      const itemsHtml = cart.map(item => {
        const safeKeyAttr = escapeAttrJs(item.key);
        return `
          <div class="cart-item-row">
            <div>
              <div style="font-size:13.5px; font-weight:600;">${escapeHtml(item.name)}</div>
              <div style="font-size:12px; color:var(--text-muted);">${formatVND(item.price)} / ${escapeHtml(item.unitLabel)}</div>
            </div>
            <div class="qty-control">
              <button type="button" class="qty-btn" onclick="changeCartQty('${safeKeyAttr}', -1)">−</button>
              <span style="font-size:13px; font-weight:600; min-width:18px; text-align:center;">${item.qty}</span>
              <button type="button" class="qty-btn" onclick="changeCartQty('${safeKeyAttr}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      const wholesaleNotice = (totalPacks >= 10 || totalBaseUnits >= 100) ? `
        <div style="background:var(--warn-bg); color:var(--warn-text); padding:10px 12px; border-radius:10px; font-size:12.5px;">
          Đơn của mình có <strong>${totalBaseUnits} tờ/cái</strong> — đơn số lượng lớn tiệm có áp dụng chiết khấu riêng. Mình có thể nhắn trực tiếp cho tiệm trước để chốt giá ưu đãi nhé!
        </div>
      ` : "";

      const savedInfoBanner = savedCust ? `
        <div class="saved-info-bar">
          <span>✓ Đã tự điền thông tin từ lần đặt trước</span>
          <button type="button" class="clear-saved-btn" onclick="clearSavedCustomerInfo()">Xóa thông tin đã lưu</button>
        </div>
      ` : "";

      body.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${itemsHtml}
        </div>
        ${wholesaleNotice}
        <div class="summary-card">
          <div class="summary-line"><span>Tiền giấy:</span><span>${formatVND(subtotal)}</span></div>
          <div class="summary-line"><span>Phí ship (Freeship đơn từ 200K & Bộ kit):</span><span>${shipFee === 0 ? "Miễn phí" : formatVND(shipFee)}</span></div>
          <div class="summary-line summary-total"><span>Tổng thanh toán (COD):</span><span>${formatVND(total)}</span></div>
        </div>

        ${savedInfoBanner}

        <form id="orderForm" onsubmit="submitOrder(event)" style="display:flex; flex-direction:column; gap:11px;">
          <div class="form-group">
            <label>1. Tên người nhận *</label>
            <input id="custName" class="form-control" type="text" placeholder="Ví dụ: Minh Anh" value="${escapeHtml(savedCust ? savedCust.customerName : "")}" required />
          </div>

          <div class="form-group">
            <label>2. Số điện thoại nhận hàng *</label>
            <input id="custPhone" class="form-control" type="tel" placeholder="Ví dụ: 0912345678" value="${escapeHtml(savedCust ? savedCust.phone : "")}" required />
          </div>

          <div class="form-group">
            <label>3. Địa chỉ giao hàng *</label>
            <textarea id="custAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required>${escapeHtml(savedCust ? savedCust.address : "")}</textarea>
          </div>

          <div class="form-group">
            <label>4. Ứng dụng bạn dùng để nhắn với tiệm *</label>
            <div class="platform-pills">
              <div class="plat-option ${selectedPlatform === 'Instagram' ? 'selected' : ''}" onclick="selectPlatform('Instagram', this)">Instagram</div>
              <div class="plat-option ${selectedPlatform === 'Threads' ? 'selected' : ''}" onclick="selectPlatform('Threads', this)">Threads</div>
              <div class="plat-option ${selectedPlatform === 'Facebook' ? 'selected' : ''}" onclick="selectPlatform('Facebook', this)">Facebook</div>
            </div>
          </div>

          <div class="form-group">
            <label>5. Tên tài khoản (User / Nickname) trên ${escapeHtml(selectedPlatform)} *</label>
            <small>Tiệm lưu lại để tìm đúng tài khoản của mình và nhắn xác nhận đơn ạ</small>
            <input id="custSocial" class="form-control" type="text" placeholder="Ví dụ: @minhanh.paper hoặc tên Facebook của mình" value="${escapeHtml(savedCust ? savedCust.socialHandle : "")}" required />
          </div>

          <div class="form-group">
            <label>6. Ghi chú thêm (nếu có)</label>
            <input id="custNote" class="form-control" type="text" placeholder="Ví dụ: Mix 5 tờ quế + 5 tờ vỏ quýt, hoặc muốn chuyển khoản trước..." />
          </div>

          <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-main); cursor:pointer; user-select:none;">
            <input id="saveCustInfoChk" type="checkbox" checked style="width:16px; height:16px; accent-color:var(--primary);" />
            <span>Lưu thông tin cho lần đặt sau</span>
          </label>

          <button id="confirmOrderBtn" type="submit" class="submit-order-btn">Gửi đơn đặt hàng</button>
        </form>
      `;
    }

    function selectPlatform(plat, el) {
      selectedPlatform = plat;
      document.querySelectorAll(".plat-option").forEach(node => node.classList.remove("selected"));
      el.classList.add("selected");
      const label = el.closest(".form-group").nextElementSibling.querySelector("label");
      if (label) label.textContent = `5. Tên tài khoản (User / Nickname) trên ${plat} *`;
    }

    async function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("confirmOrderBtn");
      const customerName = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const socialHandle = document.getElementById("custSocial").value.trim();
      const note = document.getElementById("custNote").value.trim();
      const shouldSaveInfo = document.getElementById("saveCustInfoChk")?.checked !== false;

      if (!customerName || !phone || !address || !socialHandle) {
        showToast("Mình điền đủ thông tin giúp tiệm nhé ạ");
        return;
      }

      const { subtotal, shipFee, total } = calcCartTotals();
      const orderPayload = {
        customerName,
        phone,
        address,
        platform: selectedPlatform,
        socialHandle,
        note,
        items: cart.map(i => ({
          id: i.id,
          name: i.name,
          buyMode: i.buyMode,
          unitLabel: i.unitLabel,
          qty: i.qty,
          price: i.price,
          baseUnits: i.qty * i.baseUnitsPerQty
        })),
        subtotal,
        discountType: "amount",
        discountValue: 0,
        discountAmount: 0,
        shipFee,
        total,
        paymentMethod: "COD",
        trackingCode: ""
      };

      btn.disabled = true;
      btn.textContent = "Đang gửi đơn về tiệm...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "create_order", order: orderPayload })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Không gửi được đơn");

        if (shouldSaveInfo) {
          saveCustomerInfoToStorage({
            customerName,
            phone,
            address,
            platform: selectedPlatform,
            socialHandle
          });
        } else {
          try { localStorage.removeItem(CUSTOMER_STORAGE_KEY); } catch (err) {}
        }

        const itemsSummary = cart.map(i => `• ${i.name}: ${i.qty} ${i.unitLabel} (${formatVND(i.price * i.qty)})`).join("\n");
        cart = [];
        saveCartToStorage();
        updateCartBadge();
        hideModal("cartOverlay");
        await loadInventory();

        const shipDisplay = shipFee === 0 ? "(miễn phí ship)" : `(gồm ship ${formatVND(shipFee)})`;
        appendBotMessage(`Dạ tiệm đã nhận được đơn của mình rồi ạ!\n\nNgười nhận: ${customerName} (${phone})\nĐịa chỉ: ${address}\nTài khoản liên hệ: ${socialHandle} (${selectedPlatform})\nĐơn giấy:\n${itemsSummary}\nTổng cộng: ${formatVND(total)} ${shipDisplay}\n\nMình vui lòng chờ tiệm kiểm tra và nhắn tin xác nhận lại qua ${selectedPlatform} (${socialHandle}) trước khi gói hàng ạ.`);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Gửi đơn đặt hàng";
        showToast("Có lỗi kết nối, mình thử bấm gửi lại giúp tiệm nhé");
        console.error(err);
      }
    }

    function appendUserMessage(text) {
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `<div class="bubble"></div>`;
      row.querySelector(".bubble").textContent = text;
      chatStream.appendChild(row);
      chatHistory.push({ role: "user", text });
      scrollBottom();
    }

    function appendTypingIndicator() {
      const row = document.createElement("div");
      row.id = "typingRow";
      row.className = "msg-row bot";
      row.innerHTML = `<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
      chatStream.appendChild(row);
      scrollBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typingRow");
      if (el) el.remove();
    }

    function appendBotMessage(replyText, extra = {}) {
      const row = document.createElement("div");
      row.className = "msg-row bot";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = replyText;
      row.appendChild(bubble);

      if (Array.isArray(extra.suggestedItems) && extra.suggestedItems.length > 0) {
        const validSuggestions = extra.suggestedItems
          .map(s => {
            const prod = products.find(p => p.id === s.id || p.name === s.name);
            if (!prod || prod.stock <= 0) return null;
            let mode = s.buyMode === "unit" ? "unit" : "pack";
            if (mode === "pack" && !hasPackOption(prod)) mode = "unit";
            if (mode === "unit" && !hasUnitOption(prod) && hasPackOption(prod)) mode = "pack";

            const perUnit = mode === "pack" ? prod.packSize : 1;
            const unitPrice = mode === "pack" ? prod.packPrice : prod.unitPrice;
            const label = mode === "pack" ? (prod.packUnit || "gói") : prod.baseUnit;
            const maxQty = Math.floor(prod.stock / perUnit);
            const qty = Math.min(Math.max(1, Number(s.qty || 1)), maxQty);
            if (qty <= 0 || unitPrice <= 0) return null;

            return { prod, mode, qty, unitPrice, label };
          })
          .filter(Boolean);

        if (validSuggestions.length > 0) {
          const box = document.createElement("div");
          box.className = "suggest-box";
          validSuggestions.forEach(item => {
            const itemEl = document.createElement("div");
            itemEl.className = "suggest-item";
            itemEl.innerHTML = `
              <span><strong>${escapeHtml(item.prod.name)}</strong> (${item.qty} ${escapeHtml(item.label)} • ${formatShortK(item.unitPrice * item.qty)})</span>
              <button class="suggest-add">+ Thêm giỏ</button>
            `;
            itemEl.querySelector("button").onclick = () => addToCart(item.prod.id, item.mode, item.qty);
            box.appendChild(itemEl);
          });
          row.appendChild(box);
        }
      }

      if (extra.showContactButtons) {
        const prefill = extra.contactPrefill || replyText;
        const contactCard = document.createElement("div");
        contactCard.className = "contact-card";
        contactCard.innerHTML = `
          <div style="font-size:12px; font-weight:600; margin-bottom:6px; color:var(--primary);">Nhắn trực tiếp cho tiệm qua ứng dụng bạn đang dùng:</div>
          <div class="prefill-box">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(prefill)}</span>
            <button type="button" class="copy-mini">Copy nội dung</button>
          </div>
          <div class="social-links">
            <a class="social-btn social-fb" href="${SOCIAL_LINKS.facebook}" target="_blank" rel="noopener noreferrer">Facebook</a>
            <a class="social-btn social-ig" href="${SOCIAL_LINKS.instagram}" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a class="social-btn social-th" href="${SOCIAL_LINKS.threads}" target="_blank" rel="noopener noreferrer">Threads</a>
          </div>
        `;
        contactCard.querySelector(".copy-mini").onclick = () => copyText(prefill);
        contactCard.querySelectorAll(".social-btn").forEach(a => {
          a.addEventListener("click", () => copyText(prefill));
        });
        row.appendChild(contactCard);
      }

      chatStream.appendChild(row);
      chatHistory.push({ role: "model", text: replyText });
      scrollBottom();
    }

    function sendQuickText(text) {
      if (isSending) return;
      chatInput.value = text;
      handleFormSubmit(new Event("submit"));
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || isSending) return;

      chatInput.value = "";
      appendUserMessage(text);

      if (/^(xem|danh sách|các loại giấy|menu|bảng giá)/i.test(text) && text.length < 38) {
        appendBotMessage("Dạ dưới đây là các mẫu giấy hiện có của tiệm (kèm số lượng còn sẵn và quy cách từng loại), mình lướt ngang để xem ạ:");
        renderCatalogMessage("Tất cả");
        return;
      }

      isSending = true;
      sendBtn.disabled = true;
      appendTypingIndicator();

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "chat",
            message: text,
            history: chatHistory.slice(-8)
          })
        });
        const json = await res.json();
        removeTypingIndicator();

        if (!json.ok || !json.data) {
          throw new Error(json.error || "Phản hồi AI không hợp lệ");
        }

        const ai = json.data;
        appendBotMessage(ai.reply || "Dạ mình cần tiệm hỗ trợ thêm mẫu nào ạ?", {
          intent: ai.intent,
          showContactButtons: Boolean(ai.showContactButtons),
          contactPrefill: ai.contactPrefill || text,
          suggestedItems: ai.suggestedItems || []
        });
      } catch (err) {
        removeTypingIndicator();
        const fallbackMsg = IS_DEBUG
          ? `[Lỗi kỹ thuật]: ${err.message}`
          : "Dạ mình nhắn trực tiếp giúp tiệm qua Facebook/Instagram/Threads để tiệm tư vấn chính xác nhất cho mình ạ.";
        appendBotMessage(fallbackMsg, {
          showContactButtons: true,
          contactPrefill: text
        });
        console.error(err);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }

    (async function init() {
      loadCartFromStorage();
      renderWelcome();
      await loadInventory();
    })();
  </script>
</body>
</html>
