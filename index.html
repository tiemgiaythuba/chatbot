<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tiệm giấy Thứ Ba — Tư vấn & Đặt giấy thủ công</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F4EFE6;
      --bg-app: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-soft: #F1EBE1;
      --border: #E5DDD0;
      --primary: #5C4033;
      --primary-hover: #473026;
      --accent: #4B6B50;
      --accent-soft: #E8F0E9;
      --warn-bg: #FDF3E7;
      --warn-text: #9C5A1E;
      --text-main: #2D241E;
      --text-muted: #786B61;
      --shadow-sm: 0 2px 8px rgba(45, 36, 30, 0.05);
      --shadow-md: 0 8px 24px rgba(45, 36, 30, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 15px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }

    .brand-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      background: #FFFFFF;
    }

    .brand-info { min-width: 0; }
    .brand-info h1 {
      font-family: 'Lora', serif;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; display: inline-block; flex-shrink: 0; }
    .status-dot.loading { background: #E6A23C; animation: pulse 1.2s infinite; }
    .status-dot.error { background: #D9534F; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 9px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .new-chat-btn:active { background: var(--border); color: var(--primary); }

    .cart-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 7px 11px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .cart-badge {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      min-width: 19px;
      height: 19px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* Chat Stream */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; }
    .msg-row.full-width { max-width: 100%; width: 100%; }

    .bubble {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.52;
      white-space: pre-line;
      word-break: break-word;
    }

    .msg-row.bot .bubble {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg-row.user .bubble {
      background: var(--primary);
      color: #FAF7F2;
      border-bottom-right-radius: 4px;
    }

    .quick-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    /* Catalog Carousel */
    .catalog-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .product-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }

    .product-card {
      min-width: 226px;
      max-width: 226px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      flex-shrink: 0;
    }

    .product-thumb {
      width: 100%;
      height: 132px;
      background: var(--bg-soft);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .product-thumb img.slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.55s ease-in-out;
      z-index: 1;
    }
    .product-thumb img.slide-img.active {
      opacity: 1;
    }

    .slide-dots {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 3;
      background: rgba(30, 22, 17, 0.35);
      padding: 3px 6px;
      border-radius: 999px;
    }
    .slide-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
    }
    .slide-dot.active {
      background: #FFFFFF;
      transform: scale(1.2);
    }

    .paper-art {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      font-family: 'Lora', serif;
      font-size: 12.5px;
      color: var(--primary);
      background-image: radial-gradient(rgba(92, 64, 51, 0.12) 1px, transparent 0);
      background-size: 12px 12px;
    }

    .stock-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      z-index: 3;
      max-width: calc(100% - 16px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stock-pill.out { background: var(--warn-bg); color: var(--warn-text); }

    .in-cart-pill {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0,0,0,0.14);
      z-index: 3;
    }

    .product-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .product-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      cursor: pointer;
    }
    .product-title:hover { color: var(--primary); text-decoration: underline; }

    .price-block { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .price-main { font-size: 13.5px; font-weight: 700; color: var(--primary); }
    .price-sub { font-size: 11.5px; font-weight: 600; color: #4A3D34; }
    .unsized-hint { font-size: 11px; color: var(--warn-text); margin-top: 2px; }

    .card-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
    .buy-btn-row { display: flex; gap: 5px; }

    .btn-outline {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary-sm {
      flex: 1;
      background: var(--primary);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-accent-sm {
      flex: 1;
      background: var(--accent-soft);
      border: 1px solid #C8DBC9;
      color: #2E5A36;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-preorder-sm {
      width: 100%;
      background: var(--warn-bg);
      border: 1px solid #EBD3B5;
      color: var(--warn-text);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-mix-sm {
      width: 100%;
      background: #F4EFE6;
      border: 1px dashed var(--primary);
      color: var(--primary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* VietQR Payment Card */
    .vietqr-card {
      margin-top: 8px;
      background: #FFFFFF;
      border: 1.5px solid #C8DBC9;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .vietqr-img {
      width: 210px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px;
    }
    .vietqr-info-grid {
      width: 100%;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }
    .vietqr-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    /* Mix Paper Modal */
    .mix-progress-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .mix-flavor-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Freeship Progress Bar inside Cart */
    .freeship-bar-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .freeship-bar-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .freeship-bar-text.done { color: var(--accent); }
    .freeship-track {
      width: 100%;
      height: 7px;
      background: var(--bg-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .freeship-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .freeship-fill.done { background: var(--accent); }

    /* Order Lookup Card inside Chat */
    .lookup-card {
      margin-top: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lookup-form-row {
      display: flex;
      gap: 6px;
    }
    .lookup-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--text-main);
    }
    .lookup-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .lookup-order-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .lookup-status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    .lookup-status-pill.ok {
      background: var(--accent-soft);
      color: #2E5A36;
    }

    /* Detail Modal 2-Column Gallery */
    .detail-gallery-split {
      display: flex;
      gap: 2%;
      align-items: stretch;
    }
    .detail-gallery-main {
      position: relative;
      width: 80%;
      aspect-ratio: 1 / 1;
      max-height: 235px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    .detail-gallery-main.single {
      width: 100%;
      max-height: 245px;
    }
    .detail-gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.88);
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .gallery-thumbs-col {
      width: 18%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      justify-content: flex-start;
    }
    .gallery-thumb-btn {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      padding: 0;
      cursor: pointer;
      background: var(--bg-soft);
    }
    .gallery-thumb-btn.active {
      border-color: var(--primary);
    }
    .gallery-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spec-bullets {
      list-style: disc;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13.5px;
      color: var(--text-main);
    }

    /* Suggested Items Card inside AI Reply */
    .suggest-box {
      margin-top: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .suggest-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }

    .suggest-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Contact Social Card */
    .contact-card {
      margin-top: 8px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .prefill-box {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .copy-mini {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }

    .social-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      color: #fff;
    }
    .social-fb { background: #1877F2; }
    .social-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .social-th { background: #1C1C1E; }

    /* Bottom Composer */
    .composer-wrap {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    .hint-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .hint-strip::-webkit-scrollbar { display: none; }

    .hint-pill {
      background: var(--bg-app);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 4px 6px 4px 14px;
    }
    .input-row:focus-within { border-color: var(--primary); }
    .input-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      padding: 7px 0;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .ai-disclaimer {
      font-size: 10.5px;
      line-height: 1.35;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
      padding: 0 4px;
    }

    /* Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 22, 17, 0.48);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .overlay.open { display: flex; }

    .sheet-modal {
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      background: var(--bg-app);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.24s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-head {
      padding: 14px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h2 { font-family: 'Lora', serif; font-size: 17px; font-weight: 600; }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-app);
      font-size: 16px;
      cursor: pointer;
    }

    .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .cart-item-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 6px;
    }
    .qty-btn { width: 24px; height: 24px; border: none; background: #fff; border-radius: 6px; font-weight: 700; cursor: pointer; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12.5px; font-weight: 600; color: var(--text-main); }
    .form-group small { font-size: 11px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
    }

    .platform-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .plat-option {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .plat-option.selected { border-color: var(--primary); background: var(--bg-soft); color: var(--primary); }

    .saved-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border: 1px solid #C8DBC9;
      color: #2E5A36;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
    .clear-saved-btn {
      background: #fff;
      border: 1px solid #C8DBC9;
      color: #9C5A1E;
      border-radius: 6px;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .summary-line { display: flex; justify-content: space-between; gap: 10px; }
    .summary-total {
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      margin-top: 2px;
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
    }

    .submit-order-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-order-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: #2D241E;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }

    .typing-bubble {
      display: inline-flex;
      align-items: flex-start;
      gap: 9px;
      background: var(--bg-soft) !important;
      border-style: dashed !important;
    }
    .typing-label {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-muted);
      font-style: italic;
      transition: opacity 0.22s ease;
    }
    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; margin-top: 3px; flex-shrink: 0; }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.45; } 40% { transform: scale(1); opacity: 1; } }

    .debug-source-tag {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 4px;
      padding-left: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="brand-avatar">
          <img src="logo.png" alt="Logo Tiệm giấy Thứ Ba" onerror="this.remove();" />
          <span>TB</span>
        </div>
        <div class="brand-info">
          <h1>Tiệm giấy Thứ Ba</h1>
          <div class="status-line">
            <span id="statusDot" class="status-dot loading"></span>
            <span id="statusText">Đang cập nhật kho giấy...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="new-chat-btn" onclick="resetChatSession()" title="Bắt đầu cuộc trò chuyện mới">↻ Chat mới</button>
        <button type="button" class="cart-btn" onclick="openCartModal()">
          <span>Giỏ hàng</span>
          <span id="cartCount" class="cart-badge">0</span>
        </button>
      </div>
    </header>

    <main id="chatStream" class="chat-stream"></main>

    <div class="composer-wrap">
      <div class="hint-strip">
        <button class="hint-pill" onclick="sendQuickText('Xem các loại giấy đang có sẵn')">Giấy đang có sẵn</button>
        <button class="hint-pill" onclick="openOrderLookupCard()">Tra cứu đơn</button>
        <button class="hint-pill" onclick="sendQuickText('Giấy có viết được bút mực không?')">Viết bút mực</button>
        <button class="hint-pill" onclick="sendQuickText('Phí ship như thế nào ạ?')">Phí ship</button>
        <button class="hint-pill" onclick="openCartModal()">Lên đơn ngay</button>
      </div>
      <form class="input-row" onsubmit="handleFormSubmit(event)">
        <input id="chatInput" type="text" placeholder="Hỏi tiệm loại giấy, số lượng, giá tiền..." autocomplete="off" />
        <button id="sendBtn" type="submit" class="send-btn" aria-label="Gửi">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="ai-disclaimer">Câu trả lời được tổng hợp từ thông tin của tiệm bằng AI nên tốc độ có thể hơi chậm và đôi lúc chưa thật chính xác ạ.</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="detailOverlay" class="overlay" onclick="closeOverlay(event, 'detailOverlay')">
    <div class="sheet-modal">
      <div class="modal-head">
        <h2 id="detailTitle">Chi tiết sản phẩm</h2>
        <button class="close-btn" onclick="hideModal('detailOverlay')">✕</button>
      </div>
      <div id="detailBody" class="modal-body"></div>
    </div>
  </div>

  <div id="cartOverlay" class="overlay" onclick="closeOverlay(event, 'cartOverlay')">
    <div class="sheet-modal">
      <div class="modal-head">
        <h2>Giỏ giấy & Thông tin gửi hàng</h2>
        <button class="close-btn" onclick="hideModal('cartOverlay')">✕</button>
      </div>
      <div id="cartBody" class="modal-body"></div>
    </div>
  </div>

  <div id="mixOverlay" class="overlay" onclick="closeOverlay(event, 'mixOverlay')">
    <div class="sheet-modal">
      <div class="modal-head">
        <h2 id="mixModalTitle">Mix mẫu giấy theo gói</h2>
        <button class="close-btn" onclick="hideModal('mixOverlay')">✕</button>
      </div>
      <div id="mixModalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbBP4TCXCwWPNOlCVhe2ke8FcG2DrH_FmVunFesAptU4eEVPuNJizwQnbBlAGycXMf/exec";

    const SOCIAL_LINKS = {
      facebook: "https://www.facebook.com/search/top?q=Ti%E1%BB%87m%20gi%E1%BA%A5y%20Th%E1%BB%A9%20Ba",
      instagram: "https://www.instagram.com/",
      threads: "https://www.threads.net/"
    };

    const CART_STORAGE_KEY = "TGTB_CART_V1";
    const CUSTOMER_STORAGE_KEY = "TGTB_CUSTOMER_INFO_V1";
    const SESSION_STORAGE_KEY = "TGTB_CHAT_SESSION_V1";
    const CHAT_MESSAGES_STORAGE_KEY = "TGTB_CHAT_MESSAGES_V1";
    const LAST_ORDER_STORAGE_KEY = "TGTB_LAST_ORDER_ID_V1";
    const IS_DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";

    function createChatSessionId() {
      return "S" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
    }

    function getOrCreateChatSessionId() {
      try {
        const saved = localStorage.getItem(SESSION_STORAGE_KEY);
        if (saved && saved.length >= 6) return saved;
        const fresh = createChatSessionId();
        localStorage.setItem(SESSION_STORAGE_KEY, fresh);
        return fresh;
      } catch (e) {
        return createChatSessionId();
      }
    }

    let products = [];
    let bankConfig = null;
    let cart = [];
    let chatHistory = [];
    let persistedChatFeed = [];
    let chatSessionId = getOrCreateChatSessionId();
    let lastPlacedOrderId = "";
    try { lastPlacedOrderId = localStorage.getItem(LAST_ORDER_STORAGE_KEY) || ""; } catch (e) {}
    let selectedCategory = "Tất cả";
    let selectedPlatform = "Instagram";
    let selectedPaymentMethod = "COD";
    let mixState = null;
    let isSending = false;
    let detailSlideIndex = 0;
    let detailImages = [];
    let detailTimer = null;
    let typingStepTimer = null;
    let lastReadyStatusText = "";

    const chatStream = document.getElementById("chatStream");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttrJs(str) {
      return String(str ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\r?\n/g, " ");
    }

    // --- LƯU & KHÔI PHỤC LỊCH SỬ CHAT TRÊN TRÌNH DUYỆT KHÁCH ---
    function saveChatMessagesToStorage() {
      try {
        localStorage.setItem(CHAT_MESSAGES_STORAGE_KEY, JSON.stringify(persistedChatFeed.slice(-40)));
      } catch (e) {}
    }

    function loadChatMessagesFromStorage() {
      try {
        const raw = localStorage.getItem(CHAT_MESSAGES_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveCartToStorage() {
      try {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      } catch (e) {}
    }

    function loadCartFromStorage() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            cart = parsed.filter(it => it && it.id && Number(it.qty) > 0);
          }
        }
      } catch (e) {}
      updateCartBadge();
    }

    function reconcileCartWithInventory() {
      if (!cart.length) return;
      let adjusted = false;
      const nextCart = [];
      const usedMap = {};

      cart.forEach(item => {
        if (item.buyMode === "mix" && Array.isArray(item.mixBreakdown)) {
          let validMix = true;
          item.mixBreakdown.forEach(part => {
            const p = products.find(prod => prod.id === part.id);
            const needed = Number(part.units || 0) * Number(item.qty || 1);
            if (!p || (usedMap[p.id] || 0) + needed > p.stock) {
              validMix = false;
            }
          });
          if (!validMix) {
            adjusted = true;
            return;
          }
          item.mixBreakdown.forEach(part => {
            usedMap[part.id] = (usedMap[part.id] || 0) + Number(part.units || 0) * Number(item.qty || 1);
          });
          nextCart.push(item);
          return;
        }

        const p = products.find(prod => prod.id === item.id);
        if (!p || p.stock <= 0) {
          adjusted = true;
          return;
        }
        let mode = item.buyMode === "pack" ? "pack" : "unit";
        if (mode === "pack" && !hasPackOption(p)) mode = "unit";
        if (mode === "unit" && !hasUnitOption(p) && hasPackOption(p)) mode = "pack";

        const baseUnitsPerQty = mode === "pack" ? p.packSize : 1;
        const price = mode === "pack" ? p.packPrice : p.unitPrice;
        const unitLabel = mode === "pack" ? `${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})` : p.baseUnit;

        if (price <= 0) {
          adjusted = true;
          return;
        }

        const alreadyUsed = usedMap[p.id] || 0;
        const remainingStock = Math.max(0, p.stock - alreadyUsed);
        const maxPossibleQty = Math.floor(remainingStock / baseUnitsPerQty);

        if (maxPossibleQty <= 0) {
          adjusted = true;
          return;
        }

        const finalQty = Math.min(Number(item.qty || 1), maxPossibleQty);
        if (finalQty !== Number(item.qty)) adjusted = true;

        usedMap[p.id] = alreadyUsed + finalQty * baseUnitsPerQty;
        nextCart.push({
          key: `${p.id}_${mode}`,
          id: p.id,
          name: p.name,
          buyMode: mode,
          unitLabel,
          baseUnitsPerQty,
          price,
          qty: finalQty
        });
      });

      cart = nextCart;
      saveCartToStorage();
      updateCartBadge();
      if (adjusted) {
        showToast("Đã cập nhật lại giỏ hàng theo tồn kho mới nhất");
      }
    }

    function loadSavedCustomerInfo() {
      try {
        const raw = localStorage.getItem(CUSTOMER_STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && typeof data === "object") return data;
      } catch (e) {}
      return null;
    }

    function saveCustomerInfoToStorage(info) {
      try {
        localStorage.setItem(CUSTOMER_STORAGE_KEY, JSON.stringify({
          customerName: info.customerName || "",
          phone: info.phone || "",
          address: info.address || "",
          platform: info.platform || "Instagram",
          socialHandle: info.socialHandle || ""
        }));
      } catch (e) {}
    }

    function clearSavedCustomerInfo() {
      try {
        localStorage.removeItem(CUSTOMER_STORAGE_KEY);
      } catch (e) {}
      selectedPlatform = "Instagram";
      renderCartModalContent(true);
      showToast("Đã xóa thông tin giao hàng đã lưu");
    }

    function parseImages(p) {
      if (Array.isArray(p.imageUrls) && p.imageUrls.length) {
        return p.imageUrls.map(u => String(u).trim()).filter(Boolean).slice(0, 3);
      }
      if (!p.imageUrl) return [];
      return String(p.imageUrl).split(/[\n,]+/).map(u => u.trim()).filter(Boolean).slice(0, 3);
    }

    function formatVND(num) {
      return Number(num || 0).toLocaleString("vi-VN") + "đ";
    }

    function formatShortK(num) {
      const n = Number(num || 0);
      if (n >= 1000 && n % 1000 === 0) return (n / 1000) + "K";
      return formatVND(n);
    }

    function showToast(text) {
      const t = document.getElementById("toast");
      t.textContent = text;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    function copyText(text, customMsg = "Đã copy nội dung") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(customMsg));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(customMsg);
      }
    }

    function scrollBottom() {
      requestAnimationFrame(() => {
        chatStream.scrollTop = chatStream.scrollHeight;
      });
    }

    function hasPackOption(p) {
      return Number(p.packPrice || 0) > 0 && Number(p.packSize || 1) > 1;
    }

    function hasUnitOption(p) {
      return Number(p.unitPrice || 0) > 0;
    }

    function getCompactStockBadge(p) {
      if (p.stock > 0) {
        return `Còn ${p.stock} ${p.baseUnit}`;
      }
      if (Number(p.unsizedStock || 0) > 0) {
        return `Chưa gia keo (${p.unsizedStock})`;
      }
      return "Tạm hết sẵn";
    }

    function getFullStockDetail(p) {
      if (p.stock > 0) {
        if (hasPackOption(p)) {
          const packs = Math.floor(p.stock / p.packSize);
          return `Còn ${p.stock} ${p.baseUnit} (${packs} ${p.packUnit || "gói"})`;
        }
        return `Còn ${p.stock} ${p.baseUnit}`;
      }
      return `0 ${p.baseUnit}`;
    }

    function formatSpecsBullets(specsText) {
      const raw = String(specsText || "").trim() || "Giấy tái chế thủ công từ tiệm giấy Thứ Ba.";
      const safe = raw.replace(/(\d)\.(\d)/g, "$1__DECIMAL__$2");
      const parts = safe
        .split(/[\r\n.]+/)
        .map(s => s.replace(/__DECIMAL__/g, ".").trim())
        .filter(Boolean);

      if (parts.length <= 1) {
        return `<p style="font-size:13.5px; color:var(--text-main);">${escapeHtml(raw)}</p>`;
      }
      return `<ul class="spec-bullets">${parts.map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>`;
    }

    function handleThumbImgError(imgEl) {
      const wrap = imgEl.parentElement;
      imgEl.remove();
      if (!wrap) return;
      const remaining = wrap.querySelectorAll("img.slide-img");
      if (remaining.length === 0) {
        const dots = wrap.querySelector(".slide-dots");
        if (dots) dots.remove();
        const fallback = wrap.querySelector(".paper-art");
        if (fallback) fallback.style.display = "flex";
      } else if (!Array.from(remaining).some(i => i.classList.contains("active"))) {
        remaining[0].classList.add("active");
      }
    }

    setInterval(() => {
      document.querySelectorAll(".product-thumb[data-multi='1']").forEach(thumb => {
        const imgs = thumb.querySelectorAll("img.slide-img");
        const dots = thumb.querySelectorAll(".slide-dot");
        if (imgs.length <= 1) return;
        let activeIdx = Array.from(imgs).findIndex(img => img.classList.contains("active"));
        const nextIdx = (activeIdx + 1) % imgs.length;
        imgs.forEach((img, idx) => img.classList.toggle("active", idx === nextIdx));
        dots.forEach((dot, idx) => dot.classList.toggle("active", idx === nextIdx));
      });
    }, 3000);

    async function loadInventory() {
      const dot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      dot.className = "status-dot loading";
      statusText.textContent = "Đang cập nhật kho giấy...";

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Không tải được kho");

        bankConfig = json.bankConfig && json.bankConfig.accountNo ? json.bankConfig : null;

        products = (json.products || []).map(p => ({
          ...p,
          stock: Number(p.stock || 0),
          unsizedStock: Number(p.unsizedStock || 0),
          packSize: Math.max(1, Number(p.packSize || 1)),
          packPrice: Number(p.packPrice || 0),
          unitPrice: Number(p.unitPrice || 0),
          imageUrls: parseImages(p)
        }));

        reconcileCartWithInventory();

        dot.className = "status-dot";
        const availableCount = products.filter(p => p.stock > 0).length;
        lastReadyStatusText = `Sẵn sàng • ${availableCount} mẫu đang có sẵn`;
        statusText.textContent = lastReadyStatusText;
      } catch (err) {
        dot.className = "status-dot error";
        statusText.textContent = "Lỗi kết nối kho — chạm để thử lại";
        statusText.style.cursor = "pointer";
        statusText.onclick = loadInventory;
        console.error(err);
      }
    }

    function resetChatSession() {
      if (isSending) return;
      chatHistory = [];
      persistedChatFeed = [];
      lastPlacedOrderId = "";
      chatSessionId = createChatSessionId();
      try {
        localStorage.setItem(SESSION_STORAGE_KEY, chatSessionId);
        localStorage.removeItem(CHAT_MESSAGES_STORAGE_KEY);
        localStorage.removeItem(LAST_ORDER_STORAGE_KEY);
      } catch (e) {}
      chatStream.innerHTML = "";
      renderWelcome();
      showToast("Đã làm mới cuộc trò chuyện");
    }

    function renderWelcome() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="bubble">Tiệm giấy Thứ Ba chào bạn.
Mình có thể xem nhanh các mẫu giấy đang có sẵn, hỏi số lượng/giá tiền hoặc lên đơn trực tiếp ở đây mà không cần chờ tiệm rep nhé.</div>
        <div class="quick-grid">
          <button class="chip-btn" onclick="renderCatalogMessage()">Xem các loại giấy đang có</button>
          <button class="chip-btn" onclick="sendQuickText('Tư vấn giúp mình chọn giấy phù hợp nhé')">Tư vấn chọn giấy</button>
          <button class="chip-btn" onclick="openOrderLookupCard()">Tra cứu đơn hàng</button>
          <button class="chip-btn" onclick="openCartModal()">Lên đơn nhanh</button>
        </div>
      `;
      chatStream.appendChild(row);
    }

    // --- TRA CỨU TÌNH TRẠNG ĐƠN HÀNG NGAY TRONG CHAT ---
    function openOrderLookupCard() {
      const existing = document.getElementById("orderLookupRow");
      if (existing) existing.remove();

      const savedCust = loadSavedCustomerInfo();
      const defaultQuery = lastPlacedOrderId || (savedCust && savedCust.phone ? savedCust.phone : "");

      const row = document.createElement("div");
      row.id = "orderLookupRow";
      row.className = "msg-row bot full-width";
      row.innerHTML = `
        <div class="bubble" style="max-width:100%;">
          <strong>Tra cứu tình trạng đơn hàng</strong>
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">Nhập Số điện thoại đặt hàng hoặc Mã đơn (VD: DH261122...) để kiểm tra trạng thái & mã vận đơn ạ:</div>
          <div class="lookup-card">
            <form class="lookup-form-row" onsubmit="submitOrderLookup(event)">
              <input id="lookupQueryInput" class="lookup-input" type="text" placeholder="SĐT hoặc mã đơn..." value="${escapeHtml(defaultQuery)}" required />
              <button id="lookupSubmitBtn" type="submit" class="lookup-submit">Kiểm tra</button>
            </form>
            <div id="lookupResultsBox"></div>
          </div>
        </div>
      `;
      chatStream.appendChild(row);
      scrollBottom();
      setTimeout(() => {
        const inp = document.getElementById("lookupQueryInput");
        if (inp) inp.focus();
      }, 120);
    }

    async function submitOrderLookup(e) {
      e.preventDefault();
      const inp = document.getElementById("lookupQueryInput");
      const btn = document.getElementById("lookupSubmitBtn");
      const box = document.getElementById("lookupResultsBox");
      if (!inp || !btn || !box) return;

      const query = inp.value.trim();
      if (!query) return;

      btn.disabled = true;
      btn.textContent = "Đang tìm...";
      box.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">Đang tra cứu đơn trên hệ thống tiệm...</div>`;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "lookup_order",
            query: query,
            sessionId: chatSessionId
          })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Không tra cứu được");

        const list = json.orders || [];
        if (!list.length) {
          box.innerHTML = `<div style="font-size:12.5px; color:var(--warn-text); background:var(--warn-bg); padding:8px 10px; border-radius:8px;">Dạ tiệm chưa tìm thấy đơn nào khớp với "<strong>${escapeHtml(query)}</strong>". Bạn kiểm tra lại SĐT hoặc nhắn trực tiếp cho tiệm nhé!</div>`;
          return;
        }

        const activeBank = (json.bankConfig && json.bankConfig.accountNo) ? json.bankConfig : bankConfig;

        box.innerHTML = list.map(o => {
          const isOk = o.status === "Đã xác nhận" || o.status === "Đang giao" || o.status === "Hoàn thành";
          const isPaid = o.paymentMethod === "Đã thanh toán CK";
          const showQrBtn = !isPaid && activeBank && activeBank.accountNo && o.status !== "Đã hủy";
          const trackHtml = o.trackingCode
            ? `<div style="display:flex; align-items:center; justify-content:space-between; gap:6px; background:var(--bg-soft); padding:5px 8px; border-radius:7px; margin-top:3px;">
                <span>Mã vận đơn: <strong>${escapeHtml(o.trackingCode)}</strong></span>
                <button type="button" class="copy-mini" onclick="copyText('${escapeAttrJs(o.trackingCode)}', 'Đã copy mã vận đơn')">Copy mã</button>
              </div>`
            : `<div style="font-size:11.5px; color:var(--text-muted);">Mã vận đơn: Đang cập nhật</div>`;

          const qrInlineHtml = showQrBtn
            ? `<div style="margin-top:4px;">
                <button type="button" class="copy-mini" style="width:100%; padding:6px;" onclick="appendVietQrMessage('${escapeAttrJs(o.orderId)}', ${Number(o.total || 0)}, activeBank)">📱 Hiện mã QR chuyển khoản VietQR (${formatVND(o.total)})</button>
              </div>`
            : "";

          return `
            <div class="lookup-order-item">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <strong style="color:var(--primary);">#${escapeHtml(o.orderId)}</strong>
                <span class="lookup-status-pill ${isOk ? 'ok' : ''}">${escapeHtml(o.status)}</span>
              </div>
              <div style="font-size:11.5px; color:var(--text-muted);">${escapeHtml(o.createdAt)} • ${escapeHtml(o.customerName)} (${escapeHtml(o.phoneMasked)})</div>
              <div><strong>Sản phẩm:</strong> ${escapeHtml(o.itemsSummary)}</div>
              <div><strong>Tổng đơn:</strong> ${formatVND(o.total)} (${isPaid ? "Đã thanh toán CK" : (o.paymentMethod === "Chuyển khoản trước" ? "Chờ xác nhận CK" : "COD khi nhận hàng")})</div>
              ${trackHtml}
              ${qrInlineHtml}
            </div>
          `;
        }).join("");
        scrollBottom();
      } catch (err) {
        box.innerHTML = `<div style="font-size:12px; color:#C94A4A;">Lỗi kết nối: ${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Kiểm tra";
      }
    }

    function getCartQtyForProduct(productId) {
      return cart.reduce((sum, c) => {
        if (c.buyMode === "mix" && Array.isArray(c.mixBreakdown)) {
          const found = c.mixBreakdown.find(part => part.id === productId);
          return sum + (found ? Number(found.units || 0) * Number(c.qty || 1) : 0);
        }
        return c.id === productId ? sum + Number(c.qty || 0) : sum;
      }, 0);
    }

    function getMixableGroupForProduct(p) {
      if (!p || !hasPackOption(p)) return [];
      return products.filter(item =>
        item.category === p.category &&
        hasPackOption(item) &&
        Number(item.packSize) === Number(p.packSize) &&
        Number(item.packPrice) === Number(p.packPrice) &&
        (item.stock - getUsedBaseUnitsForProduct(item.id)) > 0
      );
    }

    function canMixProduct(p) {
      const group = getMixableGroupForProduct(p);
      if (group.length < 2) return false;
      const totalAvail = group.reduce((s, item) => s + Math.max(0, item.stock - getUsedBaseUnitsForProduct(item.id)), 0);
      return totalAvail >= Number(p.packSize);
    }

    function renderCatalogMessage(filterCat = "Tất cả") {
      selectedCategory = filterCat;
      const existing = document.getElementById("catalogCardRow");
      if (existing) existing.remove();

      const row = document.createElement("div");
      row.id = "catalogCardRow";
      row.className = "msg-row bot full-width";

      if (!products.length) {
        row.innerHTML = `<div class="bubble">Dạ kho giấy đang tải hoặc chưa có dữ liệu, bạn đợi vài giây rồi bấm lại giúp tiệm nhé.</div>`;
        chatStream.appendChild(row);
        scrollBottom();
        return;
      }

      const categories = ["Tất cả", ...new Set(products.map(p => p.category).filter(Boolean))];
      const filtered = filterCat === "Tất cả" ? products : products.filter(p => p.category === filterCat);

      const tabsHtml = categories.map(c =>
        `<button class="cat-tab ${c === filterCat ? 'active' : ''}" onclick="renderCatalogMessage('${escapeAttrJs(c)}')">${escapeHtml(c)}</button>`
      ).join("");

      const cardsHtml = filtered.map(p => {
        const isOut = p.stock <= 0;
        const hasUnsized = Number(p.unsizedStock || 0) > 0;
        const canPack = hasPackOption(p) && p.stock >= p.packSize;
        const canUnit = hasUnitOption(p) && p.stock >= 1;
        const imgs = parseImages(p);
        const inCartQty = getCartQtyForProduct(p.id);

        let priceHtml = "";
        if (hasPackOption(p) && hasUnitOption(p)) {
          priceHtml = `
            <div class="price-main">${formatShortK(p.packPrice)} / ${escapeHtml(p.packUnit || "gói")} (${p.packSize} ${escapeHtml(p.baseUnit)})</div>
            <div class="price-sub">Mua lẻ: ${formatShortK(p.unitPrice)} / ${escapeHtml(p.baseUnit)}</div>
          `;
        } else if (hasPackOption(p)) {
          priceHtml = `
            <div class="price-main">${formatShortK(p.packPrice)} / ${escapeHtml(p.packUnit || "gói")}</div>
            <div class="price-sub">Quy cách: ${p.packSize} ${escapeHtml(p.baseUnit)}/${escapeHtml(p.packUnit || "gói")}</div>
          `;
        } else {
          priceHtml = `
            <div class="price-main">${formatShortK(p.unitPrice)} / ${escapeHtml(p.baseUnit)}</div>
          `;
        }

        const unsizedNoteHtml = hasUnsized
          ? `<div class="unsized-hint">${isOut ? `Đang gia keo ${p.unsizedStock} ${escapeHtml(p.baseUnit)} (giao sau ~1 tuần)` : `Đang làm thêm ${p.unsizedStock} ${escapeHtml(p.baseUnit)} (~1 tuần)`}</div>`
          : "";

        let thumbHtml = "";
        if (imgs.length > 0) {
          const imgTags = imgs.map((url, idx) =>
            `<img class="slide-img ${idx === 0 ? 'active' : ''}" src="${escapeHtml(url)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="handleThumbImgError(this);" />`
          ).join("");
          const dotsHtml = imgs.length > 1
            ? `<div class="slide-dots">${imgs.map((_, idx) => `<span class="slide-dot ${idx === 0 ? 'active' : ''}"></span>`).join("")}</div>`
            : "";
          thumbHtml = `${imgTags}${dotsHtml}<div class="paper-art" style="display:none;"><span>${escapeHtml(p.name)}</span></div>`;
        } else {
          thumbHtml = `<div class="paper-art"><span>${escapeHtml(p.name)}</span></div>`;
        }

        const safeIdAttr = escapeAttrJs(p.id);
        let actionButtonsHtml = "";
        if (isOut && hasUnsized) {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Đặt trước (giao sau ~1 tuần)</button>`;
        } else if (isOut) {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Đặt làm thêm</button>`;
        } else if (canPack && canUnit) {
          actionButtonsHtml = `
            <div class="buy-btn-row">
              <button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'pack', 1)">+ ${escapeHtml(p.packUnit || "Gói")} (${formatShortK(p.packPrice)})</button>
              <button class="btn-accent-sm" onclick="addToCart('${safeIdAttr}', 'unit', 1)">+ Lẻ (${formatShortK(p.unitPrice)})</button>
            </div>
          `;
        } else if (canPack) {
          actionButtonsHtml = `<button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'pack', 1)">+ Thêm ${escapeHtml(p.packUnit || "gói")} (${formatShortK(p.packPrice)})</button>`;
        } else if (canUnit) {
          actionButtonsHtml = `<button class="btn-primary-sm" onclick="addToCart('${safeIdAttr}', 'unit', 1)">+ Thêm giỏ (${formatShortK(p.unitPrice)})</button>`;
        } else {
          actionButtonsHtml = `<button class="btn-preorder-sm" onclick="askPreorder('${safeIdAttr}')">Không đủ gói — Đặt thêm</button>`;
        }

        const mixBtnHtml = canMixProduct(p)
          ? `<button type="button" class="btn-mix-sm" onclick="openMixModal('${safeIdAttr}')">🎨 Mix ${p.packSize} ${escapeHtml(p.baseUnit)} nhiều mùi/màu</button>`
          : "";

        return `
          <div class="product-card">
            <div class="product-thumb" data-multi="${imgs.length > 1 ? '1' : '0'}" onclick="openDetailModal('${safeIdAttr}')">
              ${thumbHtml}
              ${inCartQty > 0 ? `<span class="in-cart-pill">✓ Đã có ${inCartQty} trong giỏ</span>` : ""}
              <span class="stock-pill ${isOut ? 'out' : ''}">${getCompactStockBadge(p)}</span>
            </div>
            <div class="product-body">
              <div>
                <div class="product-title" onclick="openDetailModal('${safeIdAttr}')">${escapeHtml(p.name)}</div>
                <div class="price-block">${priceHtml}${unsizedNoteHtml}</div>
              </div>
              <div class="card-actions">
                ${actionButtonsHtml}
                ${mixBtnHtml}
                <button class="btn-outline" onclick="openDetailModal('${safeIdAttr}')">Xem chi tiết</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      row.innerHTML = `
        <div class="catalog-box">
          <div class="cat-tabs">${tabsHtml}</div>
          <div class="product-carousel">${cardsHtml}</div>
        </div>
      `;
      chatStream.appendChild(row);
      scrollBottom();
    }

    function askPreorder(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      if (p.stock <= 0 && Number(p.unsizedStock || 0) > 0) {
        sendQuickText(`Mẫu "${p.name}" đang có ${p.unsizedStock} ${p.baseUnit} chưa gia keo (giao sau ~1 tuần), mình muốn đặt trước mẫu này ạ`);
      } else {
        sendQuickText(`Mẫu "${p.name}" đang tạm hết, mình muốn hỏi đặt làm thêm ạ`);
      }
    }

    function setDetailSlide(idx) {
      if (!detailImages.length) return;
      detailSlideIndex = (idx + detailImages.length) % detailImages.length;
      const mainImg = document.getElementById("detailMainImg");
      if (mainImg) mainImg.src = detailImages[detailSlideIndex];
      document.querySelectorAll(".gallery-thumb-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === detailSlideIndex);
      });
    }

    function openDetailModal(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      if (detailTimer) clearInterval(detailTimer);

      const isOut = p.stock <= 0;
      const hasUnsized = Number(p.unsizedStock || 0) > 0;
      const canPack = hasPackOption(p) && p.stock >= p.packSize;
      const canUnit = hasUnitOption(p) && p.stock >= 1;
      detailImages = parseImages(p);
      detailSlideIndex = 0;

      let galleryHtml = "";
      if (detailImages.length > 0) {
        const hasMulti = detailImages.length > 1;
        const navArrows = hasMulti ? `
          <button type="button" class="gallery-nav-btn" style="left:8px;" onclick="setDetailSlide(detailSlideIndex - 1)">‹</button>
          <button type="button" class="gallery-nav-btn" style="right:8px;" onclick="setDetailSlide(detailSlideIndex + 1)">›</button>
        ` : "";
        const thumbsCol = hasMulti ? `
          <div class="gallery-thumbs-col">
            ${detailImages.map((url, idx) => `
              <button type="button" class="gallery-thumb-btn ${idx === 0 ? 'active' : ''}" onclick="setDetailSlide(${idx})">
                <img src="${escapeHtml(url)}" alt="Ảnh ${idx + 1}" />
              </button>
            `).join("")}
          </div>
        ` : "";
        galleryHtml = `
          <div class="detail-gallery-split">
            <div class="detail-gallery-main ${hasMulti ? '' : 'single'}">
              <img id="detailMainImg" src="${escapeHtml(detailImages[0])}" alt="${escapeHtml(p.name)}" />
              ${navArrows}
            </div>
            ${thumbsCol}
          </div>
        `;
      }

      let priceRows = "";
      if (hasPackOption(p)) {
        priceRows += `<div class="summary-line"><span>Giá theo ${escapeHtml(p.packUnit || "gói")} (${p.packSize} ${escapeHtml(p.baseUnit)}):</span><strong>${formatVND(p.packPrice)}</strong></div>`;
      }
      if (hasUnitOption(p)) {
        priceRows += `<div class="summary-line"><span>Giá lẻ từng ${escapeHtml(p.baseUnit)}:</span><strong>${formatVND(p.unitPrice)}</strong></div>`;
      }

      const unsizedLine = hasUnsized
        ? `<div class="summary-line"><span>Giấy chưa gia keo (giao sau ~1 tuần):</span><strong style="color:var(--warn-text);">${p.unsizedStock} ${escapeHtml(p.baseUnit)}</strong></div>`
        : "";

      const safeIdAttr = escapeAttrJs(p.id);
      let modalButtons = "";
      if (isOut) {
        const btnLabel = hasUnsized
          ? "Đặt trước mẻ chưa gia keo (giao sau ~1 tuần)"
          : "Nhắn tiệm đặt làm thêm mẫu này";
        modalButtons = `<button class="submit-order-btn" onclick="hideModal('detailOverlay'); askPreorder('${safeIdAttr}')">${btnLabel}</button>`;
      } else {
        modalButtons = `<div style="display:flex; gap:8px;">`;
        if (canPack) {
          modalButtons += `<button class="submit-order-btn" style="flex:1;" onclick="addToCart('${safeIdAttr}', 'pack', 1); hideModal('detailOverlay');">+ Thêm 1 ${escapeHtml(p.packUnit || "gói")} (${formatShortK(p.packPrice)})</button>`;
        }
        if (canUnit) {
          modalButtons += `<button class="submit-order-btn" style="flex:1; background:var(--accent);" onclick="addToCart('${safeIdAttr}', 'unit', 1); hideModal('detailOverlay');">+ Thêm 1 ${escapeHtml(p.baseUnit)} (${formatShortK(p.unitPrice)})</button>`;
        }
        modalButtons += `</div>`;
        if (canMixProduct(p)) {
          modalButtons += `<button type="button" class="btn-mix-sm" style="padding:9px; font-size:12.5px;" onclick="hideModal('detailOverlay'); openMixModal('${safeIdAttr}')">🎨 Tự chọn Mix gói ${p.packSize} ${escapeHtml(p.baseUnit)} (nhiều mùi/màu)</button>`;
        }
      }

      document.getElementById("detailTitle").textContent = p.name;
      document.getElementById("detailBody").innerHTML = `
        ${galleryHtml}
        <div class="summary-card">
          ${priceRows}
          <div class="summary-line"><span>Sẵn sàng giao ngay:</span><strong>${getFullStockDetail(p)}</strong></div>
          ${unsizedLine}
          <div class="summary-line"><span>Nhóm:</span><span>${escapeHtml(p.category)}</span></div>
        </div>
        <div class="summary-card">
          <strong style="font-size:13px;">Đặc điểm chi tiết:</strong>
          ${formatSpecsBullets(p.specs)}
        </div>
        ${modalButtons}
      `;
      document.getElementById("detailOverlay").classList.add("open");

      if (detailImages.length > 1) {
        detailTimer = setInterval(() => setDetailSlide(detailSlideIndex + 1), 3000);
      }
    }

    function hideModal(id) {
      if (id === "detailOverlay" && detailTimer) {
        clearInterval(detailTimer);
        detailTimer = null;
      }
      document.getElementById(id).classList.remove("open");
    }
    function closeOverlay(e, id) { if (e.target.id === id) hideModal(id); }

    function updateCartBadge() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").textContent = totalQty;
    }

    function getUsedBaseUnitsForProduct(productId) {
      return cart.reduce((sum, c) => {
        if (c.buyMode === "mix" && Array.isArray(c.mixBreakdown)) {
          const part = c.mixBreakdown.find(pt => pt.id === productId);
          return sum + (part ? Number(part.units || 0) * c.qty : 0);
        }
        return c.id === productId ? sum + c.qty * c.baseUnitsPerQty : sum;
      }, 0);
    }

    // --- TÍNH NĂNG MIX MẪU GIẤY THEO GÓI ---
    function openMixModal(seedProductId) {
      const seed = products.find(item => item.id === seedProductId);
      if (!seed) return;
      const group = getMixableGroupForProduct(seed);
      if (group.length < 2) {
        showToast("Nhóm này hiện chưa đủ từ 2 mẫu có sẵn để mix ạ");
        return;
      }

      mixState = {
        category: seed.category,
        packSize: Number(seed.packSize),
        packPrice: Number(seed.packPrice),
        packUnit: seed.packUnit || "gói",
        baseUnit: seed.baseUnit || "tờ",
        items: group.map(item => ({
          id: item.id,
          name: item.name,
          avail: Math.max(0, item.stock - getUsedBaseUnitsForProduct(item.id)),
          qty: item.id === seed.id ? Math.min(Math.floor(seed.packSize / 2), Math.max(0, item.stock - getUsedBaseUnitsForProduct(item.id))) : 0
        }))
      };

      document.getElementById("mixModalTitle").textContent = `Mix ${mixState.packUnit} ${mixState.category} (${mixState.packSize} ${mixState.baseUnit})`;
      renderMixModalBody();
      document.getElementById("mixOverlay").classList.add("open");
    }

    function changeMixItemQty(idx, delta) {
      if (!mixState || !mixState.items[idx]) return;
      const currentTotal = mixState.items.reduce((s, it) => s + it.qty, 0);
      const item = mixState.items[idx];
      if (delta > 0) {
        if (currentTotal >= mixState.packSize) {
          showToast(`Đã đủ ${mixState.packSize} ${mixState.baseUnit} cho 1 ${mixState.packUnit} rồi ạ`);
          return;
        }
        if (item.qty + 1 > item.avail) {
          showToast(`Mẫu này chỉ còn sẵn ${item.avail} ${mixState.baseUnit} ạ`);
          return;
        }
        item.qty += 1;
      } else if (delta < 0 && item.qty > 0) {
        item.qty -= 1;
      }
      renderMixModalBody();
    }

    function autoDistributeMix() {
      if (!mixState) return;
      mixState.items.forEach(it => { it.qty = 0; });
      let remaining = mixState.packSize;
      let safety = 0;
      while (remaining > 0 && safety < 200) {
        let addedInPass = false;
        for (let i = 0; i < mixState.items.length && remaining > 0; i++) {
          if (mixState.items[i].qty < mixState.items[i].avail) {
            mixState.items[i].qty += 1;
            remaining -= 1;
            addedInPass = true;
          }
        }
        if (!addedInPass) break;
        safety++;
      }
      renderMixModalBody();
    }

    function renderMixModalBody() {
      if (!mixState) return;
      const body = document.getElementById("mixModalBody");
      const totalSelected = mixState.items.reduce((s, it) => s + it.qty, 0);
      const remaining = mixState.packSize - totalSelected;
      const isComplete = remaining === 0;

      const rowsHtml = mixState.items.map((it, idx) => `
        <div class="mix-flavor-row">
          <div>
            <div style="font-size:13.5px; font-weight:600; color:var(--text-main);">${escapeHtml(it.name)}</div>
            <div style="font-size:11.5px; color:var(--text-muted);">Còn sẵn: ${it.avail} ${escapeHtml(mixState.baseUnit)}</div>
          </div>
          <div class="qty-control">
            <button type="button" class="qty-btn" onclick="changeMixItemQty(${idx}, -1)">−</button>
            <span style="font-size:13.5px; font-weight:700; min-width:22px; text-align:center; color:${it.qty > 0 ? 'var(--primary)' : 'var(--text-muted)'};">${it.qty}</span>
            <button type="button" class="qty-btn" onclick="changeMixItemQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join("");

      body.innerHTML = `
        <div class="mix-progress-box">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
            <span style="font-size:13px; font-weight:700; color:${isComplete ? 'var(--accent)' : 'var(--primary)'};">
              ${isComplete ? `✓ Đã chọn đủ ${mixState.packSize}/${mixState.packSize} ${escapeHtml(mixState.baseUnit)}` : `Đã chọn: ${totalSelected}/${mixState.packSize} ${escapeHtml(mixState.baseUnit)} (thiếu ${remaining})`}
            </span>
            <button type="button" class="copy-mini" onclick="autoDistributeMix()">Chia đều tự động</button>

          <div style="font-size:12px; color:var(--text-muted);">Giá đồng giá gói mix: <strong style="color:var(--primary);">${formatVND(mixState.packPrice)}</strong> / ${escapeHtml(mixState.packUnit)}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${rowsHtml}
        </div>
        <button type="button" class="submit-order-btn" ${isComplete ? "" : "disabled"} onclick="confirmAddMixToCart()">
          ${isComplete ? `+ Thêm gói mix vào giỏ (${formatShortK(mixState.packPrice)})` : `Chọn thêm ${remaining} ${escapeHtml(mixState.baseUnit)} để đủ gói`}
        </button>
      `;
    }

    function confirmAddMixToCart() {
      if (!mixState) return;
      const chosen = mixState.items.filter(it => it.qty > 0);
      const totalSelected = chosen.reduce((s, it) => s + it.qty, 0);
      if (totalSelected !== mixState.packSize) return;

      const shortLabels = chosen.map(it => {
        const shortName = it.name.replace(new RegExp("^" + mixState.category.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*", "i"), "").trim() || it.name;
        return `${it.qty} ${shortName}`;
      });
      const mixTitle = `Mix ${mixState.category} (${shortLabels.join(" + ")})`;
      const mixKey = "MIX_" + chosen.map(it => `${it.id}x${it.qty}`).join("_");

      const existing = cart.find(c => c.key === mixKey);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          key: mixKey,
          id: "",
          name: mixTitle,
          buyMode: "mix",
          unitLabel: `${mixState.packUnit} mix (${mixState.packSize} ${mixState.baseUnit})`,
          baseUnitsPerQty: mixState.packSize,
          price: mixState.packPrice,
          qty: 1,
          mixBreakdown: chosen.map(it => ({ id: it.id, name: it.name, units: it.qty }))
        });
      }

      saveCartToStorage();
      updateCartBadge();
      refreshCatalogCardIfOpen();
      hideModal("mixOverlay");
      showToast(`Đã thêm ${mixTitle} vào giỏ`);
    }

    function refreshCatalogCardIfOpen() {
      if (document.getElementById("catalogCardRow")) {
        renderCatalogMessage(selectedCategory);
      }
    }

    function addToCart(id, buyMode = "pack", qty = 1) {
      const p = products.find(item => item.id === id);
      if (!p || p.stock <= 0) {
        showToast("Mẫu này hiện tạm hết hàng có sẵn ạ");
        return;
      }

      let mode = buyMode;
      if (mode === "pack" && !hasPackOption(p)) mode = "unit";
      if (mode === "unit" && !hasUnitOption(p) && hasPackOption(p)) mode = "pack";

      const baseUnitsPerQty = mode === "pack" ? p.packSize : 1;
      const price = mode === "pack" ? p.packPrice : p.unitPrice;
      const unitLabel = mode === "pack" ? `${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})` : p.baseUnit;

      if (price <= 0) {
        showToast("Sản phẩm chưa có giá cho tùy chọn này ạ");
        return;
      }

      const alreadyUsed = getUsedBaseUnitsForProduct(id);
      const needed = qty * baseUnitsPerQty;
      if (alreadyUsed + needed > p.stock) {
        showToast(`Kho sẵn sàng chỉ còn ${p.stock} ${p.baseUnit} ạ`);
        return;
      }

      const key = `${id}_${mode}`;
      const existing = cart.find(c => c.key === key);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          key,
          id: p.id,
          name: p.name,
          buyMode: mode,
          unitLabel,
          baseUnitsPerQty,
          price,
          qty
        });
      }

      saveCartToStorage();
      updateCartBadge();
      refreshCatalogCardIfOpen();
      showToast(`Đã thêm ${qty} ${unitLabel} ${p.name}`);
    }

    function changeCartQty(key, delta) {
      const idx = cart.findIndex(c => c.key === key);
      if (idx === -1) return;
      const item = cart[idx];
      const p = products.find(prod => prod.id === item.id);
      const nextQty = item.qty + delta;

      if (nextQty <= 0) {
        cart.splice(idx, 1);
      } else {
        if (item.buyMode === "mix" && Array.isArray(item.mixBreakdown)) {
          for (let i = 0; i < item.mixBreakdown.length; i++) {
            const part = item.mixBreakdown[i];
            const prod = products.find(pr => pr.id === part.id);
            if (prod) {
              const otherUsed = cart
                .filter(c => c.key !== key)
                .reduce((s, c) => {
                  if (c.buyMode === "mix" && Array.isArray(c.mixBreakdown)) {
                    const f = c.mixBreakdown.find(pt => pt.id === part.id);
                    return s + (f ? Number(f.units || 0) * c.qty : 0);
                  }
                  return c.id === part.id ? s + c.qty * c.baseUnitsPerQty : s;
                }, 0);
              if (otherUsed + nextQty * Number(part.units || 0) > prod.stock) {
                showToast(`Mẫu "${prod.name}" chỉ còn sẵn ${prod.stock} ${prod.baseUnit} ạ`);
                return;
              }
            }
          }
        } else if (p) {
          const otherUsed = cart
            .filter(c => c.id === item.id && c.key !== key)
            .reduce((s, c) => s + c.qty * c.baseUnitsPerQty, 0);
          if (otherUsed + nextQty * item.baseUnitsPerQty > p.stock) {
            showToast(`Kho sẵn sàng chỉ còn tối đa ${p.stock} ${p.baseUnit} ạ`);
            return;
          }
        }
        item.qty = nextQty;
      }
      saveCartToStorage();
      updateCartBadge();
      refreshCatalogCardIfOpen();
      renderCartModalContent();
    }

    function calcCartTotals() {
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const hasKit = cart.some(i => i.name.toLowerCase().includes("kit"));
      const totalPacks = cart.filter(i => i.buyMode === "pack").reduce((sum, i) => sum + i.qty, 0);
      const totalBaseUnits = cart.reduce((sum, i) => sum + i.qty * i.baseUnitsPerQty, 0);
      const shipFee = (subtotal === 0 || subtotal >= 200000 || hasKit) ? 0 : 15000;
      return { subtotal, shipFee, total: subtotal + shipFee, totalPacks, totalBaseUnits, hasKit };
    }

    function selectPaymentMethod(method, el) {

    function appendVietQrMessage(orderId, amount, customBank = null) {

      if (!bank || !bank.bankId || !bank.accountNo) {
        appendBotMessage(`Dạ mã đơn của mình là #${orderId} (${formatVND(amount)}). Tiệm sẽ nhắn thông tin chuyển khoản qua tin nhắn xác nhận ngay cho mình ạ!`);

              <div class="vietqr-line"><span>Nội dung CK: <strong style="color:var(--accent);">${escapeHtml(orderId)}</strong></span><button type="button" class="copy-mini" onclick="copyText('${escapeAttrJs(orderId)}', 'Đã copy nội dung chuyển khoản')">Copy ND</button></div>
