    async function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("confirmOrderBtn");
      const customerName = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const socialHandle = document.getElementById("custSocial").value.trim();
      const note = document.getElementById("custNote").value.trim();
      const shouldSaveCust = document.getElementById("saveCustInfoChk")?.checked;

      if (!customerName || !phone || !address || !socialHandle) {
        showToast("Bạn điền đủ thông tin bắt buộc nhé");
        return;
      }

      if (shouldSaveCust) {
        saveCustomerInfoToStorage({
          customerName,
          phone,
          address,
          platform: selectedPlatform,
          socialHandle
        });
      }

      const { subtotal, shipFee, total } = calcCartTotals();
      btn.disabled = true;
      btn.textContent = "Đang gửi đơn...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "create_order",
            order: {
              customerName,
              phone,
              address,
              platform: selectedPlatform,
              socialHandle,
              paymentMethod: selectedPaymentMethod,
              note,
              sessionId: chatSessionId,
              chatTranscript: chatHistory.slice(-24),
              items: cart.map(i => {
                const baseItem = {
                  id: i.id,
                  name: i.name,
                  buyMode: i.buyMode,
                  unitLabel: i.unitLabel,
                  qty: i.qty,
                  price: i.price,
                  baseUnits: i.qty * i.baseUnitsPerQty
                };
                if (i.buyMode === "mix" && Array.isArray(i.mixBreakdown)) {
                  baseItem.mixBreakdown = i.mixBreakdown;
                }
                return baseItem;
              }),
              subtotal,
              shipFee,
              total
            }
          })
        });

        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Không gửi được đơn");

        const itemsText = cart.map(i => `• ${i.name} (${i.qty} ${i.unitLabel})`).join("\n");
        const chosenPayMethod = selectedPaymentMethod;
        cart = [];
        saveCartToStorage();
        updateCartBadge();
        hideModal("cartOverlay");

        lastPlacedOrderId = json.orderId;
        try { localStorage.setItem(LAST_ORDER_STORAGE_KEY, json.orderId); } catch (e) {}

        const confirmText = `Tiệm đã nhận được đơn #${json.orderId} của ${customerName} rồi ạ!\n\nSản phẩm đặt:\n${itemsText}\n\nTổng đơn: ${formatVND(total)} (${chosenPayMethod === "Chuyển khoản trước" ? "Chuyển khoản VietQR" : (shipFee === 0 ? "Freeship • COD" : "Đã gồm 15K ship • COD")})\nGiao tới: ${address}\n\nTiệm sẽ nhắn xác nhận lại qua ${selectedPlatform} (${socialHandle}) trước khi gói hàng nhé!`;
        appendBotMessage(confirmText);

        if (chosenPayMethod === "Chuyển khoản trước") {
          appendVietQrMessage(json.orderId, total);
        }

        await loadInventory();
        refreshCatalogCardIfOpen();
      } catch (err) {
        alert("Lỗi gửi đơn: " + err.message);
        btn.disabled = false;
        btn.textContent = "Gửi đơn đặt hàng";
      }
    }

    function sendQuickText(text) {
      chatInput.value = text;
      handleFormSubmit(new Event("submit"));
    }

    function appendUserMessage(text, skipSave = false) {
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      chatStream.appendChild(row);
      if (!skipSave) {
        chatHistory.push({ role: "user", text });
        persistedChatFeed.push({ role: "user", text });
        saveChatMessagesToStorage();
      }
      scrollBottom();
    }

    function appendBotMessage(text, options = {}, skipSave = false) {
      const row = document.createElement("div");
      row.className = "msg-row bot";

      let extraHtml = "";

      if (Array.isArray(options.suggestedItems) && options.suggestedItems.length > 0) {
        const validItems = options.suggestedItems.map(s => {
          const p = products.find(item => item.id === s.id);
          if (!p || p.stock <= 0) return null;
          const mode = s.buyMode === "unit" && hasUnitOption(p) ? "unit" : (hasPackOption(p) ? "pack" : "unit");
          const unitPrice = mode === "pack" ? p.packPrice : p.unitPrice;
          const unitLabel = mode === "pack" ? `${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})` : p.baseUnit;
          const qty = Math.max(1, Number(s.qty || 1));
          return { p, mode, unitPrice, unitLabel, qty };
        }).filter(Boolean);

        if (validItems.length > 0) {
          extraHtml += `<div class="suggest-box">` + validItems.map(({ p, mode, unitPrice, unitLabel, qty }) => `
            <div class="suggest-item">
              <span><strong>${escapeHtml(p.name)}</strong> — ${qty} ${escapeHtml(unitLabel)} (${formatShortK(unitPrice * qty)})</span>
              <button class="suggest-add" onclick="addToCart('${escapeAttrJs(p.id)}', '${mode}', ${qty})">+ Thêm giỏ</button>
            </div>
          `).join("") + `</div>`;
        }
      }

      if (options.showContactButtons) {
        const prefill = options.contactPrefill || "";
        const safePrefillAttr = escapeAttrJs(prefill);
        extraHtml += `
          <div class="contact-card">
            ${prefill ? `
              <div class="prefill-box">
                <span style="overflow:hidden; text-overflow:ellipsis;">"${escapeHtml(prefill)}"</span>
                <button class="copy-mini" onclick="copyText('${safePrefillAttr}')">Copy nội dung</button>
              </div>
            ` : ""}
            <div class="social-links">
              <a class="social-btn social-fb" href="${SOCIAL_LINKS.facebook}" target="_blank" rel="noopener">Facebook</a>
              <a class="social-btn social-ig" href="${SOCIAL_LINKS.instagram}" target="_blank" rel="noopener">Instagram</a>
              <a class="social-btn social-th" href="${SOCIAL_LINKS.threads}" target="_blank" rel="noopener">Threads</a>
            </div>
          </div>
        `;
      }

      const debugHtml = (IS_DEBUG && options.source)
        ? `<div class="debug-source-tag">[Nguồn: ${escapeHtml(options.source)}${options.aiError ? " | " + escapeHtml(options.aiError) : ""}]</div>`
        : "";

      row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>${extraHtml}${debugHtml}`;
      chatStream.appendChild(row);
      if (!skipSave) {
        chatHistory.push({ role: "model", text });
        persistedChatFeed.push({ role: "model", text, options });
        saveChatMessagesToStorage();
      }
      scrollBottom();
    }

    function restorePersistedChatFeed() {
      const savedFeed = loadChatMessagesFromStorage();
      if (!savedFeed.length) return false;
      persistedChatFeed = savedFeed;
      savedFeed.forEach(item => {
        if (!item || !item.text) return;
        if (item.role === "user") {
          appendUserMessage(item.text, true);
          chatHistory.push({ role: "user", text: item.text });
        } else if (item.role === "model") {
          appendBotMessage(item.text, item.options || {}, true);
          chatHistory.push({ role: "model", text: item.text });
        }
      });
      return true;
    }

    function buildWaitingSteps(userText) {
      const lower = String(userText || "").toLowerCase();
      const matchedProd = products.find(p => p && p.name && lower.includes(p.name.toLowerCase()));
      const isPriceOrStock = /(giá|bao nhiêu|còn|hết|mua|đặt|gói|tờ|lẻ|ship|giao|mix)/i.test(lower);
      const isCareOrSpec = /(bút|mực|màu|vẽ|in|kích thước|size|định lượng|gsm|keo|kit|bột)/i.test(lower);

      const step1 = matchedProd
        ? `Đang kiểm tra thông tin mẫu ${matchedProd.name}...`
        : (isPriceOrStock
          ? "Đang tra cứu tồn kho & bảng giá hiện tại của tiệm..."
          : (isCareOrSpec
            ? "Đang đối chiếu đặc tính giấy & sổ tay hỏi đáp của tiệm..."
            : "Tiệm đang đọc câu hỏi của bạn..."));

      return [
        { delay: 0, text: step1, status: "Đang xử lý câu hỏi..." },
        { delay: 2200, text: "Đang nhờ trợ lý AI tổng hợp câu trả lời chính xác nhất...", status: "Trợ lý AI đang phân tích..." },
        { delay: 6500, text: "AI đang kiểm tra kỹ số liệu trong kho giấy, bạn đợi thêm vài giây nhé...", status: "Đang tổng hợp phản hồi..." },
        { delay: 12000, text: "Kết nối mạng hơi chậm một chút, tiệm đang hoàn tất câu trả lời...", status: "Đang hoàn tất phản hồi..." }
      ];
    }

    function showTypingIndicator(userText) {
      removeTypingIndicator();
      const row = document.createElement("div");
      row.id = "typingRow";
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="bubble typing-bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span id="typingStepLabel" class="typing-label"></span>
        </div>
      `;
      chatStream.appendChild(row);
      scrollBottom();

      const steps = buildWaitingSteps(userText);
      const labelEl = document.getElementById("typingStepLabel");
      const statusText = document.getElementById("statusText");
      let stepIdx = 0;

      const applyStep = (step) => {
        if (labelEl) {
          labelEl.style.opacity = "0.35";
          setTimeout(() => {
            if (labelEl) {
              labelEl.textContent = step.text;
              labelEl.style.opacity = "1";
            }
          }, 120);
        }
        if (statusText && step.status) {
          statusText.textContent = step.status;
        }
      };

      applyStep(steps[0]);

      typingStepTimer = setInterval(() => {
        if (stepIdx + 1 < steps.length) {
          stepIdx++;
          applyStep(steps[stepIdx]);
        }
      }, 3600);
    }

    function removeTypingIndicator() {
      if (typingStepTimer) {
        clearInterval(typingStepTimer);
        typingStepTimer = null;
      }
      const statusText = document.getElementById("statusText");
      if (statusText && lastReadyStatusText) {
        statusText.textContent = lastReadyStatusText;
      }
      const el = document.getElementById("typingRow");
      if (el) el.remove();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (isSending) return;

      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = "";
      appendUserMessage(text);

      const lower = text.toLowerCase();
      if (lower.includes("xem các loại giấy") || lower === "menu" || lower === "danh sách giấy") {
        renderCatalogMessage();
        return;
      }

      if (lower === "tra cứu đơn" || lower === "tra cứu đơn hàng" || lower === "kiểm tra đơn") {
        openOrderLookupCard();
        return;
      }

      isSending = true;
      sendBtn.disabled = true;
      showTypingIndicator(text);

      const savedCust = loadSavedCustomerInfo();
      const customerInfo = savedCust ? {
        customerName: savedCust.customerName || "",
        phone: savedCust.phone || "",
        platform: savedCust.platform || "",
        socialHandle: savedCust.socialHandle || "",
        orderId: lastPlacedOrderId || ""
      } : (lastPlacedOrderId ? { orderId: lastPlacedOrderId } : null);

      const controller = new AbortController();
      // Tăng thời gian chờ lên 25 giây để đủ cho Apps Script + Gemini AI phản hồi hoàn chỉnh
      const timeoutId = setTimeout(() => controller.abort(), 25000);

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          signal: controller.signal,
          body: JSON.stringify({
            action: "chat",
            message: text,
            history: chatHistory.slice(-6),
            sessionId: chatSessionId,
            customerInfo: customerInfo
          })
        });
        clearTimeout(timeoutId);

        const json = await res.json();
        removeTypingIndicator();

        if (!json.ok || !json.data) {
          throw new Error(json.error || "Phản hồi AI không hợp lệ");
        }

        if (json.aiError) {
          console.warn("[Tiệm giấy AI fallback]", json.source, json.aiError);
        } else {
          console.info("[Tiệm giấy AI source]", json.source);
        }

        const ai = json.data;
        appendBotMessage(ai.reply, {
          showContactButtons: Boolean(ai.showContactButtons),
          contactPrefill: ai.contactPrefill || text,
          suggestedItems: ai.suggestedItems || [],
          source: json.source || "",
          aiError: json.aiError || ""
        });
      } catch (err) {
        clearTimeout(timeoutId);
        removeTypingIndicator();
        const isTimeout = err && err.name === "AbortError";
        const fallbackMsg = isTimeout
          ? "Dạ kết nối mạng đang hơi chậm, bạn thử gửi lại câu hỏi hoặc nhắn trực tiếp giúp tiệm qua Facebook/Instagram/Threads để tiệm hỗ trợ ngay nhé ạ!"
          : (IS_DEBUG
            ? `[Lỗi kỹ thuật]: ${err.message}`
            : "Dạ bạn nhắn trực tiếp giúp tiệm qua Facebook/Instagram/Threads để tiệm tư vấn chính xác nhất cho bạn ạ.");
        appendBotMessage(fallbackMsg, {
          showContactButtons: true,
          contactPrefill: text
        });
        console.error(err);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }

    (async function init() {
      loadCartFromStorage();
      renderWelcome();
      restorePersistedChatFeed();
      await loadInventory();
    })();
  </script>
</body>
</html>
