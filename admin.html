<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Tiệm giấy Thứ Ba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-paper: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-soft: #F3EDE3;
      --bark: #5C4033;
      --bark-dark: #3E2A21;
      --moss: #4A5D4E;
      --moss-light: #E8EFE9;
      --greige: #E5DDD0;
      --text-main: #2D241E;
      --text-muted: #786B61;
      --vip-bg: #FDF3E7;
      --vip-border: #E8C79B;
      --vip-text: #8C5219;
      --danger: #B84A39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lexend', sans-serif;
      background: var(--bg-paper);
      color: var(--text-main);
      line-height: 1.55;
    }

    /* Login Screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--greige);
      border-radius: 18px;
      padding: 28px 24px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 10px 30px rgba(62,42,33,0.08);
    }
    .login-card h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.25rem;
      color: var(--bark);
      margin-bottom: 6px;
    }
    .login-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    .input-full {
      width: 100%;
      border: 1px solid var(--greige);
      background: var(--bg-paper);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .input-full:focus { outline: none; border-color: var(--bark); background: #fff; }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }
    .remember-row input { width: 16px; height: 16px; accent-color: var(--bark); }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--bark); color: #FAF7F2; }
    .btn-primary:hover { background: var(--bark-dark); }
    .btn-moss { background: var(--moss); color: #fff; }
    .btn-soft { background: var(--bg-soft); color: var(--bark); border: 1px solid var(--greige); }
    .btn-danger { background: #FDECE8; color: var(--danger); border: 1px solid #F3C4BC; }

    /* Admin Dashboard */
    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--greige);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .topbar-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--bark);
    }
    .tabs {
      max-width: 1120px;
      margin: 16px auto 0;
      padding: 0 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 1px solid var(--greige);
      background: var(--bg-card);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--bark); color: #FAF7F2; border-color: var(--bark); }
    .main { max-width: 1120px; margin: 16px auto 60px; padding: 0 18px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Filter Pills */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .pill {
      border: 1px solid var(--greige);
      background: #fff;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .pill.active { background: var(--moss); color: #fff; border-color: var(--moss); }

    /* Order Card */
    .order-card {
      background: var(--bg-card);
      border: 1px solid var(--greige);
      border-radius: 14px;
      padding: 15px 16px;
      margin-bottom: 12px;
    }
    .order-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .vip-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--vip-bg);
      border: 1px solid var(--vip-border);
      color: var(--vip-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      margin-left: 6px;
    }
    .vip-gift-note {
      background: var(--vip-bg);
      color: var(--vip-text);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: inline-block;
    }

    /* Product Grid in Admin */
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .prod-card {
      background: var(--bg-card);
      border: 1px solid var(--greige);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .mini-thumbs { display: flex; gap: 6px; }
    .mini-thumbs img {
      width: 56px;
      height: 44px;
      object-fit: cover;
      border-radius: 7px;
      border: 1px solid var(--greige);
    }

    /* Product Modal (3 Image Slots) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45,36,30,0.48);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--greige);
      border-radius: 16px;
      max-width: 620px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .fg label { font-size: 0.79rem; color: var(--text-muted); font-weight: 500; }
    .fg input, .fg select, .fg textarea {
      border: 1px solid var(--greige);
      background: var(--bg-paper);
      border-radius: 9px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .photo-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 560px) {
      .photo-slots { grid-template-columns: 1fr; }
    }
    .photo-slot {
      border: 1px dashed #C7BCB0;
      background: var(--bg-paper);
      border-radius: 11px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slot-preview {
      aspect-ratio: 4 / 3;
      background: var(--bg-soft);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
    .slot-preview img { width: 100%; height: 100%; object-fit: cover; }
    .slot-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(45,36,30,0.75);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Tiệm giấy Thứ Ba</h1>
    <p id="loginHint">Đăng nhập trang quản lý kho giấy và đơn hàng</p>
    <input type="password" class="input-full" id="adminPassInput" placeholder="Nhập mật khẩu quản trị" onkeydown="if(event.key==='Enter') doLogin(false)" />
    <label class="remember-row">
      <input type="checkbox" id="rememberLoginChk" checked />
      <span>Ghi nhớ đăng nhập trên thiết bị này</span>
    </label>
    <button class="btn btn-primary" style="width:100%;" id="loginBtn" onclick="doLogin(false)">Vào trang quản lý</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboardWrap" style="display:none;">
  <header class="topbar">
    <span class="topbar-title">Quản lý Tiệm giấy Thứ Ba</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-soft" onclick="refreshAll()">Làm mới</button>
      <button class="btn btn-danger" onclick="logoutAdmin()">Đăng xuất</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('orders', this)">Đơn hàng (<span id="orderCountBadge">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('products', this)">Kho giấy (<span id="prodCountBadge">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('faqs', this)">Hỏi - Đáp AI</button>
    <button class="tab-btn" onclick="switchTab('settings', this)">Cài đặt</button>
  </nav>

  <main class="main">
    <!-- Tab 1: Orders -->
    <section class="tab-pane active" id="tab-orders">
      <div class="filter-row">
        <button class="pill active" onclick="setOrderFilter('ALL', this)">Tất cả</button>
        <button class="pill" onclick="setOrderFilter('Chờ xác nhận', this)">Chờ xác nhận</button>
        <button class="pill" onclick="setOrderFilter('Đang gói / Gửi', this)">Đang gói / Gửi</button>
        <button class="pill" onclick="setOrderFilter('Hoàn thành', this)">Hoàn thành</button>
        <button class="pill" onclick="setOrderFilter('VIP', this)">★ Khách quen</button>
        <button class="pill" onclick="setOrderFilter('Đã hủy', this)">Đã hủy</button>
        <input type="text" id="orderSearchInput" placeholder="Tìm tên, SĐT, mã đơn..." oninput="renderOrders()"
          style="border:1px solid var(--greige);border-radius:999px;padding:5px 13px;font-family:inherit;font-size:0.82rem;margin-left:auto;" />
      </div>
      <div id="ordersList"></div>
    </section>

    <!-- Tab 2: Products -->
    <section class="tab-pane" id="tab-products">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <span style="font-size:0.86rem;color:var(--text-muted);">Hỗ trợ tối đa 3 ảnh/sản phẩm (tổng thể, cận vân sợi, test mực bút)</span>
        <button class="btn btn-primary" onclick="openProductModal()">+ Thêm mẫu giấy mới</button>
      </div>
      <div class="prod-grid" id="adminProdGrid"></div>
    </section>

    <!-- Tab 3: FAQs -->
    <section class="tab-pane" id="tab-faqs">
      <div style="background:#fff;border:1px solid var(--greige);border-radius:14px;padding:15px;margin-bottom:16px;">
        <h3 style="font-size:0.95rem;color:var(--bark);margin-bottom:10px;">Thêm / Sửa câu hỏi thường gặp</h3>
        <input type="hidden" id="faqIdInput" />
        <div class="fg">
          <label>Câu hỏi khách hay hỏi</label>
          <input type="text" id="faqQInput" placeholder="Ví dụ: Giấy có viết được bút mực không?" />
        </div>
        <div class="fg">
          <label>Câu trả lời chuẩn của tiệm</label>
          <textarea id="faqAInput" rows="2" placeholder="Ví dụ: Có gia keo nhẹ nên hạn chế lem khi viết bằng bút mực."></textarea>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="saveFaq()">Lưu hỏi đáp</button>
          <button class="btn btn-soft" onclick="resetFaqForm()">Làm mới ô nhập</button>
        </div>
      </div>
      <div id="faqList"></div>
    </section>

    <!-- Tab 4: Settings -->
    <section class="tab-pane" id="tab-settings">
      <div style="background:#fff;border:1px solid var(--greige);border-radius:14px;padding:18px;max-width:520px;">
        <h3 style="font-size:0.98rem;color:var(--bark);margin-bottom:12px;">Thông báo đơn hàng & Trợ lý AI</h3>
        <div class="fg">
          <label>Email nhận thông báo khi có đơn mới</label>
          <input type="email" id="notifyEmailInput" placeholder="tiemgiaythuba@gmail.com" />
        </div>
        <label class="remember-row">
          <input type="checkbox" id="aiEnabledChk" checked />
          <span>Bật Gemini AI hỗ trợ diễn đạt câu trả lời (luôn có bộ lọc nội bộ dự phòng)</span>
        </label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="saveSettings()">Lưu cài đặt</button>
          <button class="btn btn-soft" onclick="testEmail()">Gửi email thử</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Product Add/Edit Modal (3 Photos) -->
<div class="overlay" id="prodModalOverlay" onclick="if(event.target===this) closeProductModal()">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2 style="font-family:'Montserrat',sans-serif;font-size:1.08rem;color:var(--bark);" id="prodModalTitle">Thêm mẫu giấy</h2>
      <button class="btn btn-soft" style="padding:4px 10px;" onclick="closeProductModal()">×</button>
    </div>

    <input type="hidden" id="pId" />
    <div class="form-grid">
      <div class="fg">
        <label>Tên sản phẩm *</label>
        <input type="text" id="pName" placeholder="Giấy tái chế lá tre A5" />
      </div>
      <div class="fg">
        <label>Nhóm sản phẩm</label>
        <input type="text" id="pCategory" placeholder="Giấy A5 / Thiệp / Bao thư / Kit" />
      </div>
    </div>

    <div class="form-grid">
      <div class="fg">
        <label>Đơn vị gốc (tờ / bao / bộ)</label>
        <input type="text" id="pBaseUnit" value="tờ" />
      </div>
      <div class="fg">
        <label>Tồn kho (tính theo đơn vị gốc)</label>
        <input type="number" id="pStock" value="0" min="0" />
      </div>
    </div>

    <div class="form-grid">
      <div class="fg">
        <label>Đơn vị bán theo gói (để trống nếu bán lẻ)</label>
        <input type="text" id="pPackUnit" placeholder="gói / xấp / set" />
      </div>
      <div class="fg">
        <label>Số lượng trong 1 gói</label>
        <input type="number" id="pPackSize" value="1" min="1" />
      </div>
    </div>

    <div class="form-grid">
      <div class="fg">
        <label>Giá 1 gói (VNĐ)</label>
        <input type="number" id="pPackPrice" value="0" min="0" />
      </div>
      <div class="fg">
        <label>Giá bán lẻ 1 tờ/cái (0 nếu không bán lẻ)</label>
        <input type="number" id="pUnitPrice" value="0" min="0" />
      </div>
    </div>

    <div class="fg">
      <label>Bộ 2–3 ảnh sản phẩm (tổng thể, cận vân sợi, test mực bút)</label>
      <div class="photo-slots">
        <div class="photo-slot">
          <div class="slot-preview" id="slotPreview0">Ảnh 1: Tổng thể</div>
          <input type="file" id="slotFile0" accept="image/*" style="display:none;" onchange="handleSlotUpload(0, this)" />
          <button type="button" class="btn btn-soft" style="padding:5px 8px;font-size:0.76rem;" onclick="document.getElementById('slotFile0').click()">Tải ảnh 1</button>
          <input type="text" id="slotUrl0" placeholder="Hoặc dán link ảnh 1" oninput="syncSlotPreview(0)" style="font-size:0.75rem;padding:5px 7px;" />
        </div>
        <div class="photo-slot">
          <div class="slot-preview" id="slotPreview1">Ảnh 2: Cận bề mặt</div>
          <input type="file" id="slotFile1" accept="image/*" style="display:none;" onchange="handleSlotUpload(1, this)" />
          <button type="button" class="btn btn-soft" style="padding:5px 8px;font-size:0.76rem;" onclick="document.getElementById('slotFile1').click()">Tải ảnh 2</button>
          <input type="text" id="slotUrl1" placeholder="Hoặc dán link ảnh 2" oninput="syncSlotPreview(1)" style="font-size:0.75rem;padding:5px 7px;" />
        </div>
        <div class="photo-slot">
          <div class="slot-preview" id="slotPreview2">Ảnh 3: Test mực</div>
          <input type="file" id="slotFile2" accept="image/*" style="display:none;" onchange="handleSlotUpload(2, this)" />
          <button type="button" class="btn btn-soft" style="padding:5px 8px;font-size:0.76rem;" onclick="document.getElementById('slotFile2').click()">Tải ảnh 3</button>
          <input type="text" id="slotUrl2" placeholder="Hoặc dán link ảnh 3" oninput="syncSlotPreview(2)" style="font-size:0.75rem;padding:5px 7px;" />
        </div>
      </div>
    </div>

    <div class="fg">
      <label>Mô tả kích thước, định lượng, đặc điểm bề mặt</label>
      <textarea id="pSpecs" rows="3" placeholder="Kích thước 148x210mm, định lượng 120-180gsm, bề mặt xử lý keo nhẹ hạn chế lem mực..."></textarea>
    </div>

    <label class="remember-row">
      <input type="checkbox" id="pVisible" checked />
      <span>Hiển thị sản phẩm này trên trang khách hàng</span>
    </label>

    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
      <button class="btn btn-soft" onclick="closeProductModal()">Hủy</button>
      <button class="btn btn-primary" id="saveProdBtn" onclick="saveProduct()">Lưu sản phẩm</button>
    </div>
  </div>
</div>

<script>
  // DÁN LINK WEB APP GOOGLE APPS SCRIPT (/exec) CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbBP4TCXCwWPNOlCVhe2ke8FcG2DrH_FmVunFesAptU4eEVPuNJizwQnbBlAGycXMf/exec";

  const SESSION_KEY = "tgtb_admin_session_v1";
  const SESSION_TTL_MS = 30 * 24 * 60 * 60 * 1000;

  let adminPassword = "";
  let allProducts = [];
  let allOrders = [];
  let allFaqs = [];
  let currentOrderFilter = "ALL";

  const SLOT_PLACEHOLDERS = ["Ảnh 1: Tổng thể", "Ảnh 2: Cận bề mặt", "Ảnh 3: Test mực"];

  function fmtPrice(n) {
    return Number(n || 0).toLocaleString("vi-VN") + "đ";
  }

  function normalizePhone(phone) {
    let digits = String(phone || "").replace(/\D/g, "");
    if (digits.startsWith("84") && digits.length >= 11) {
      digits = "0" + digits.slice(2);
    }
    return digits;
  }

  function parseImageUrls(raw) {
    return String(raw || "")
      .split(/[\r\n|,]+/)
      .map(s => s.trim())
      .filter(s => /^https?:\/\//i.test(s))
      .slice(0, 3);
  }

  // Ghi nhớ phiên đăng nhập Admin trên máy cá nhân
  function getSavedSession() {
    try {
      const raw = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      if (!raw || !raw.password) return null;
      if (Date.now() - Number(raw.savedAt || 0) > SESSION_TTL_MS) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
      return raw.password;
    } catch (e) {
      return null;
    }
  }

  function saveSession(pw) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      password: pw,
      savedAt: Date.now()
    }));
  }

  function logoutAdmin() {
    localStorage.removeItem(SESSION_KEY);
    adminPassword = "";
    document.getElementById("dashboardWrap").style.display = "none";
    document.getElementById("loginWrap").style.display = "flex";
    document.getElementById("adminPassInput").value = "";
  }

  async function doLogin(isAuto) {
    const passInput = document.getElementById("adminPassInput");
    const pw = isAuto ? getSavedSession() : passInput.value.trim();
    if (!pw) return;

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = isAuto ? "Đang khôi phục phiên đăng nhập..." : "Đang kiểm tra...";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "admin_login", password: pw })
      });
      const data = await res.json();
      if (data.ok) {
        adminPassword = pw;
        if (isAuto || document.getElementById("rememberLoginChk").checked) {
          saveSession(pw);
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
        applyDashboardData(data);
        document.getElementById("loginWrap").style.display = "none";
        document.getElementById("dashboardWrap").style.display = "block";
      } else {
        localStorage.removeItem(SESSION_KEY);
        if (!isAuto) alert(data.error || "Sai mật khẩu");
      }
    } catch (e) {
      if (!isAuto) alert("Lỗi kết nối Apps Script. Bạn kiểm tra lại SCRIPT_URL nhé!");
    } finally {
      btn.disabled = false;
      btn.textContent = "Vào trang quản lý";
    }
  }

  async function refreshAll() {
    if (!adminPassword) return;
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_all", password: adminPassword })
    });
    const data = await res.json();
    if (data.ok) applyDashboardData(data);
  }

  function applyDashboardData(data) {
    allProducts = data.products || [];
    allOrders = data.orders || [];
    allFaqs = data.faqs || [];

    document.getElementById("orderCountBadge").textContent = String(allOrders.length);
    document.getElementById("prodCountBadge").textContent = String(allProducts.length);
    if (data.notifyEmail !== undefined) {
      document.getElementById("notifyEmailInput").value = data.notifyEmail;
    }
    if (data.aiEnabled !== undefined) {
      document.getElementById("aiEnabledChk").checked = Boolean(data.aiEnabled);
    }

    renderOrders();
    renderAdminProducts();
    renderFaqs();
  }

  function switchTab(tabName, btnEl) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
    btnEl.classList.add("active");
    document.getElementById("tab-" + tabName).classList.add("active");
  }

  // Orders + Gắn nhãn "Khách quen"
  function setOrderFilter(status, btnEl) {
    currentOrderFilter = status;
    btnEl.parentElement.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    btnEl.classList.add("active");
    renderOrders();
  }

  function buildCustomerOrderCounts() {
    const counts = {};
    allOrders.forEach(o => {
      if (String(o.status || "") === "Đã hủy") return;
      const p = normalizePhone(o.phone);
      if (p.length >= 9) {
        counts[p] = (counts[p] || 0) + 1;
      }
    });
    return counts;
  }

  function renderOrders() {
    const kw = document.getElementById("orderSearchInput").value.trim().toLowerCase();
    const phoneCounts = buildCustomerOrderCounts();

    const filtered = allOrders.filter(o => {
      const p = normalizePhone(o.phone);
      const count = phoneCounts[p] || 0;
      const isVip = count >= 2;

      if (currentOrderFilter === "VIP" && !isVip) return false;
      if (currentOrderFilter !== "ALL" && currentOrderFilter !== "VIP" && o.status !== currentOrderFilter) return false;

      if (kw) {
        const hay = `${o.orderId} ${o.customerName} ${o.phone} ${o.socialHandle} ${o.itemsSummary}`.toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });

    const wrap = document.getElementById("ordersList");
    if (!filtered.length) {
      wrap.innerHTML = `<p style="color:var(--text-muted);font-size:0.86rem;">Chưa có đơn hàng nào trong mục này.</p>`;
      return;
    }

    const statuses = ["Chờ xác nhận", "Đang gói / Gửi", "Hoàn thành", "Đã hủy"];

    wrap.innerHTML = filtered.map(o => {
      const normP = normalizePhone(o.phone);
      const orderCount = phoneCounts[normP] || 0;
      const isReturning = orderCount >= 2;
      const cleanPhone = String(o.phone || "").replace(/^'/, "");

      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <strong style="color:var(--bark);">#${o.orderId}</strong> •
              <strong>${o.customerName}</strong>
              ${isReturning ? `<span class="vip-badge">★ Khách quen (${orderCount} đơn)</span>` : ""}
              <div style="font-size:0.78rem;color:var(--text-muted);">${o.createdAt} • ${o.platform}: <strong>${o.socialHandle}</strong></div>
            </div>
            <select onchange="updateOrderStatus('${o.orderId}', this.value)"
              style="border:1px solid var(--greige);background:var(--bg-paper);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:0.82rem;">
              ${statuses.map(st => `<option value="${st}" ${o.status === st ? "selected" : ""}>${st}</option>`).join("")}
            </select>
          </div>
          <div style="font-size:0.84rem;margin-bottom:5px;">
            SĐT: <a href="tel:${cleanPhone}" style="color:var(--bark);font-weight:500;">${cleanPhone}</a> — ${o.address}
          </div>
          <div style="background:var(--bg-paper);border:1px solid var(--greige);border-radius:9px;padding:8px 11px;font-size:0.84rem;">
            <div>${o.itemsSummary}</div>
            <div style="margin-top:4px;font-weight:600;color:var(--bark);">
              Tổng COD: ${fmtPrice(o.total)} (Giấy ${fmtPrice(o.subtotal)} + Ship ${o.shipFee === 0 ? "0đ" : fmtPrice(o.shipFee)})
            </div>
          </div>
          ${o.note ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:6px;">Ghi chú: ${o.note}</div>` : ""}
          ${isReturning ? `<div class="vip-gift-note">Gợi ý: Gửi kèm mẫu giấy thử nhỏ tri ân khách quen</div>` : ""}
        </div>
      `;
    }).join("");
  }

  async function updateOrderStatus(orderId, status) {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "update_order_status", password: adminPassword, orderId, status })
    });
    const data = await res.json();
    if (data.ok) {
      allOrders = data.orders || [];
      allProducts = data.products || [];
      renderOrders();
      renderAdminProducts();
    }
  }

  // Admin Products (2-3 Photos)
  function renderAdminProducts() {
    const grid = document.getElementById("adminProdGrid");
    if (!allProducts.length) {
      grid.innerHTML = `<p style="color:var(--text-muted);">Chưa có sản phẩm nào trong kho.</p>`;
      return;
    }

    grid.innerHTML = allProducts.map(p => {
      const imgs = parseImageUrls(p.imageUrl);
      const hasPack = p.packPrice > 0 && p.packSize > 1;
      const priceText = hasPack
        ? `${fmtPrice(p.packPrice)}/${p.packUnit || "gói"} (${p.packSize} ${p.baseUnit})`
        : `${fmtPrice(p.unitPrice)}/${p.baseUnit}`;

      return `
        <div class="prod-card" style="opacity:${p.visible ? 1 : 0.6};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <span style="font-size:0.74rem;color:var(--text-muted);">${p.id} • ${p.category || ""}</span>
              <h3 style="font-size:0.96rem;color:var(--bark-dark);">${p.name}</h3>
            </div>
            <span style="font-size:0.75rem;padding:2px 8px;border-radius:999px;background:${p.visible ? "var(--moss-light)" : "#EEE"};color:${p.visible ? "var(--moss)" : "#666"};">
              ${p.visible ? "Đang hiện" : "Đang ẩn"}
            </span>
          </div>
          ${imgs.length ? `<div class="mini-thumbs">${imgs.map(u => `<img src="${u}" alt="" />`).join("")}</div>` : `<div style="font-size:0.76rem;color:var(--text-muted);">Chưa có ảnh</div>`}
          <div style="font-size:0.84rem;">
            Tồn kho: <strong>${p.stock} ${p.baseUnit}</strong> • Giá: <strong>${priceText}</strong>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;">
            <button class="btn btn-soft" style="padding:6px 10px;font-size:0.78rem;" onclick="openProductModal('${p.id}')">Sửa</button>
            <button class="btn btn-soft" style="padding:6px 10px;font-size:0.78rem;" onclick="toggleVisibility('${p.id}', ${!p.visible})">${p.visible ? "Ẩn" : "Hiện"}</button>
            <button class="btn btn-danger" style="padding:6px 10px;font-size:0.78rem;" onclick="deleteProduct('${p.id}')">Xóa</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function openProductModal(prodId) {
    const p = prodId ? allProducts.find(item => item.id === prodId) : null;
    document.getElementById("prodModalTitle").textContent = p ? `Sửa ${p.name}` : "Thêm mẫu giấy mới";
    document.getElementById("pId").value = p ? p.id : "";
    document.getElementById("pName").value = p ? p.name : "";
    document.getElementById("pCategory").value = p ? p.category : "";
    document.getElementById("pBaseUnit").value = p ? p.baseUnit : "tờ";
    document.getElementById("pStock").value = p ? p.stock : 0;
    document.getElementById("pPackUnit").value = p ? p.packUnit : "";
    document.getElementById("pPackSize").value = p ? p.packSize : 1;
    document.getElementById("pPackPrice").value = p ? p.packPrice : 0;
    document.getElementById("pUnitPrice").value = p ? p.unitPrice : 0;
    document.getElementById("pSpecs").value = p ? p.specs : "";
    document.getElementById("pVisible").checked = p ? p.visible !== false : true;

    const imgs = p ? parseImageUrls(p.imageUrl) : [];
    for (let i = 0; i < 3; i++) {
      document.getElementById("slotUrl" + i).value = imgs[i] || "";
      syncSlotPreview(i);
    }

    document.getElementById("prodModalOverlay").classList.add("open");
  }

  function closeProductModal() {
    document.getElementById("prodModalOverlay").classList.remove("open");
  }

  function syncSlotPreview(idx) {
    const url = document.getElementById("slotUrl" + idx).value.trim();
    const box = document.getElementById("slotPreview" + idx);
    if (/^https?:\/\//i.test(url)) {
      box.innerHTML = `<img src="${url}" alt="" /><button type="button" class="slot-remove" onclick="clearSlot(${idx})">×</button>`;
    } else {
      box.innerHTML = SLOT_PLACEHOLDERS[idx];
    }
  }

  function clearSlot(idx) {
    document.getElementById("slotUrl" + idx).value = "";
    syncSlotPreview(idx);
  }

  function compressImageFile(file, maxDim = 1200, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(dataUrl.split(",")[1]);
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleSlotUpload(idx, inputEl) {
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const box = document.getElementById("slotPreview" + idx);
    box.innerHTML = "Đang tải ảnh...";

    try {
      const base64 = await compressImageFile(file);
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "upload_image",
          password: adminPassword,
          base64,
          mimeType: "image/jpeg",
          fileName: `giay_${Date.now()}_${idx + 1}.jpg`
        })
      });
      const data = await res.json();
      if (data.ok && data.imageUrl) {
        document.getElementById("slotUrl" + idx).value = data.imageUrl;
        syncSlotPreview(idx);
      } else {
        alert("Lỗi tải ảnh: " + (data.error || ""));
        syncSlotPreview(idx);
      }
    } catch (e) {
      alert("Không tải được ảnh lên Drive.");
      syncSlotPreview(idx);
    } finally {
      inputEl.value = "";
    }
  }

  async function saveProduct() {
    const name = document.getElementById("pName").value.trim();
    if (!name) {
      alert("Bạn nhập tên sản phẩm nhé!");
      return;
    }

    const urls = [0, 1, 2]
      .map(i => document.getElementById("slotUrl" + i).value.trim())
      .filter(Boolean);

    const product = {
      id: document.getElementById("pId").value.trim(),
      name,
      category: document.getElementById("pCategory").value.trim(),
      baseUnit: document.getElementById("pBaseUnit").value.trim() || "tờ",
      stock: Number(document.getElementById("pStock").value || 0),
      packUnit: document.getElementById("pPackUnit").value.trim(),
      packSize: Math.max(1, Number(document.getElementById("pPackSize").value || 1)),
      packPrice: Number(document.getElementById("pPackPrice").value || 0),
      unitPrice: Number(document.getElementById("pUnitPrice").value || 0),
      specs: document.getElementById("pSpecs").value.trim(),
      visible: document.getElementById("pVisible").checked,
      imageUrl: urls.join("\n")
    };

    const btn = document.getElementById("saveProdBtn");
    btn.disabled = true;
    btn.textContent = "Đang lưu...";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "save_product", password: adminPassword, product })
      });
      const data = await res.json();
      if (data.ok) {
        allProducts = data.products || [];
        document.getElementById("prodCountBadge").textContent = String(allProducts.length);
        renderAdminProducts();
        closeProductModal();
      }
    } finally {
      btn.disabled = false;
      btn.textContent = "Lưu sản phẩm";
    }
  }

  async function toggleVisibility(id, visible) {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "toggle_product_visibility", password: adminPassword, id, visible })
    });
    const data = await res.json();
    if (data.ok) {
      allProducts = data.products || [];
      renderAdminProducts();
    }
  }

  async function deleteProduct(id) {
    if (!confirm("Xóa hẳn sản phẩm này khỏi Google Sheet?")) return;
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "delete_product", password: adminPassword, id })
    });
    const data = await res.json();
    if (data.ok) {
      allProducts = data.products || [];
      document.getElementById("prodCountBadge").textContent = String(allProducts.length);
      renderAdminProducts();
    }
  }

  // FAQs
  function renderFaqs() {
    const wrap = document.getElementById("faqList");
    wrap.innerHTML = allFaqs.map(f => `
      <div style="background:#fff;border:1px solid var(--greige);border-radius:12px;padding:12px 14px;margin-bottom:10px;">
        <div style="font-weight:600;color:var(--bark);font-size:0.88rem;">${f.question}</div>
        <div style="font-size:0.84rem;color:var(--text-muted);margin:4px 0 8px;">${f.answer}</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-soft" style="padding:4px 10px;font-size:0.76rem;" onclick="editFaq('${f.id}')">Sửa</button>
          <button class="btn btn-danger" style="padding:4px 10px;font-size:0.76rem;" onclick="deleteFaq('${f.id}')">Xóa</button>
        </div>
      </div>
    `).join("");
  }

  function editFaq(id) {
    const f = allFaqs.find(item => item.id === id);
    if (!f) return;
    document.getElementById("faqIdInput").value = f.id;
    document.getElementById("faqQInput").value = f.question;
    document.getElementById("faqAInput").value = f.answer;
  }

  function resetFaqForm() {
    document.getElementById("faqIdInput").value = "";
    document.getElementById("faqQInput").value = "";
    document.getElementById("faqAInput").value = "";
  }

  async function saveFaq() {
    const question = document.getElementById("faqQInput").value.trim();
    const answer = document.getElementById("faqAInput").value.trim();
    if (!question || !answer) return;

    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "save_faq",
        password: adminPassword,
        faq: { id: document.getElementById("faqIdInput").value.trim(), question, answer, active: true }
      })
    });
    const data = await res.json();
    if (data.ok) {
      allFaqs = data.faqs || [];
      resetFaqForm();
      renderFaqs();
    }
  }

  async function deleteFaq(id) {
    if (!confirm("Xóa câu hỏi này?")) return;
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "delete_faq", password: adminPassword, id })
    });
    const data = await res.json();
    if (data.ok) {
      allFaqs = data.faqs || [];
      renderFaqs();
    }
  }

  // Settings
  async function saveSettings() {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "save_settings",
        password: adminPassword,
        notifyEmail: document.getElementById("notifyEmailInput").value.trim(),
        aiEnabled: document.getElementById("aiEnabledChk").checked
      })
    });
    const data = await res.json();
    if (data.ok) alert("Đã lưu cài đặt!");
  }

  async function testEmail() {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "test_email", password: adminPassword })
    });
    const data = await res.json();
    alert(data.ok ? ("Đã gửi email thử tới " + data.sentTo) : ("Lỗi: " + data.error));
  }

  // Tự động đăng nhập nếu thiết bị đã lưu phiên
  window.addEventListener("DOMContentLoaded", () => {
    if (getSavedSession()) {
      doLogin(true);
    }
  });
</script>
